name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Lint protobuf
        run: buf lint

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Generate protobuf/gRPC stubs
        run: bash scripts/gen_proto.sh

      - name: Compile-check generated stubs
        run: python -m compileall packages/shared/proto

      - name: Run tests
        run: pytest
