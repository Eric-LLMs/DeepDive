          const endIn = textInput("", { type: "date" });
          const modelIn = textInput("", { placeholder: "Model (fuzzy)…" });
          const searchBtn = el("button", "btn sm primary", "Search");
          lf.append(el("span", "muted", "From"), startIn, el("span", "muted", "To"), endIn, modelIn, searchBtn);
          body.appendChild(lf);
          const lres = el("div");
          body.appendChild(lres);
          const PER = 20;
          let page = 0;
          async function loadLogs() {
            lres.innerHTML = '<div class="loading">Loading…</div>';
            const q = new URLSearchParams({ limit: String(PER), offset: String(page * PER) });
            // local "YYYY-MM-DD" → local midnight → UTC ISO.
            // From = selected date 00:00:00; To = next-day 00:00:00 (half-open range).
            if (startIn.value) q.set("start", new Date(startIn.value + "T00:00:00").toISOString());
            if (endIn.value) {
              const end = new Date(endIn.value + "T00:00:00");
              end.setDate(end.getDate() + 1);
              q.set("end", end.toISOString());
            }
            const m = modelIn.value.trim();
            if (m) q.set("model", m);
            let d;
            try { d = await apiFetch("/admin/users/" + user.id + "/usage?" + q); }
            catch (e) { lres.innerHTML = ""; lres.appendChild(errBox(e)); return; }
            const logs = d.logs || [];
            const total = d.total || 0;
            lres.innerHTML = "";
            if (!logs.length) {
              lres.appendChild(emptyState(total ? "No logs match." : "No usage logs yet."));
            } else {
              const { wrap, tbody } = table(["When", "Channel model name", "Channel", "Tool", "Tokens", "Cost"]);
              for (const l of logs) {
                const row = el("tr");
                row.appendChild(td(el("span", "muted", fmtDate(l.created_at))));
                const mCell = td();
                if (l.model_name) {
                  const link = el("a", "link", l.model_name);
                  link.href = "javascript:void(0)";
                  link.title = "View model detail";
                  link.onclick = async () => {
                    try {
                      const models = (await apiFetch("/admin/models")).models || [];
                      const m = models.find((x) => x.name === l.model_name);
                      if (m) modelDetailModal(m);
                      else toast("Model not in catalog", "err");
                    } catch (e) { toast(e.message, "err"); }
                  };
                  mCell.appendChild(link);
                } else {
                  mCell.appendChild(el("span", "muted", "—"));
                }
                row.appendChild(mCell);
                row.appendChild(td(l.credential_name ? el("span", "muted", l.credential_name) : el("span", "muted", "—")));
                row.appendChild(td(l.tool || "—"));
                row.appendChild(td(String(l.total_tokens ?? (l.prompt_tokens + " / " + l.completion_tokens))));
                row.appendChild(td(fmtMoney(l.cost_usd)));
                tbody.appendChild(row);
              }
              lres.appendChild(wrap);
            }
            const pages = Math.max(1, Math.ceil(total / PER));
            const pg = el("div", "row-actions");
            const prev = el("button", "btn sm ghost", "‹ Prev");
            prev.disabled = page <= 0;
            prev.onclick = () => { if (page > 0) { page--; loadLogs(); } };
            const next = el("button", "btn sm ghost", "Next ›");
            next.disabled = page + 1 >= pages;
            next.onclick = () => { if (page + 1 < pages) { page++; loadLogs(); } };
            pg.append(prev, el("span", "muted", "Page " + (page + 1) + " / " + pages + " · " + total + " records"), next);
            lres.appendChild(pg);
          }
          searchBtn.onclick = () => { page = 0; loadLogs(); };
          loadLogs();
        }

        // ── Tab 2: LLM-key grants (which key a user may use; access_tokens) ──
        async function renderGrantsTab(container) {
          container.innerHTML = '<div class="loading">Loading…</div>';
          let grants, users, roles, routes, wallets;
          try {
            [grants, users, roles, routes, wallets] = await Promise.all([
              apiFetch("/admin/grants").then((d) => d.grants || []),
              apiFetch("/admin/users").then((d) => d.users || []),
              apiFetch("/admin/roles").then((d) => d.roles || []),
              apiFetch("/admin/routes").then((d) => d.routes || []),
              apiFetch("/admin/wallets").then((d) => d.wallets || []),
            ]);
          } catch (e) { container.innerHTML = ""; container.appendChild(errBox(e)); return; }
          container.innerHTML = "";

          const userOf = {}, userRoleOf = {}, displayOf = {}, userById = {}, balanceOf = {};
          for (const u of users) {
            userOf[u.id] = u.username;
            userRoleOf[u.id] = u.role_id;
            displayOf[u.id] = u.display_name;
            userById[u.id] = u;
          }
          for (const w of wallets) balanceOf[w.user_id] = w.balance;
          const roleNameOf = {};
          for (const r of roles) roleNameOf[r.role_id] = r.role_name || r.role_id;
          // Models each key channel serves (via routes) → chips in the Model column.
          const modelsByCred = {};
          for (const r of routes) {
            (modelsByCred[r.credential_id] = modelsByCred[r.credential_id] || []).push(r.model_name || "?");
          }

          const bar = el("div", "bar-row");
          const title = el("div", "bar-title", "LLM key grants ");
          title.appendChild(el("span", "count", "(" + grants.length + ")"));
          bar.append(title);
          container.appendChild(bar);

          const help = el("div", "sub", "Per-user LLM-key grants (user × key). Flip a switch to cut / restore that user's access to that key — it never blocks login (with no usable key the user degrades to the anonymous tier).");
          container.appendChild(help);

          const search = textInput("", { placeholder: "Search by person…" });
          const roleSel = select([{ value: "", label: "role: all" }, ...roles.map((r) => ({ value: r.role_id, label: r.role_id }))], "");
          const filters = el("div", "filter-bar");
          filters.append(search, roleSel);
          container.appendChild(filters);

          const wrapBox = el("div");
          container.appendChild(wrapBox);
          const render = () => {
            wrapBox.innerHTML = "";
            const q = search.value.trim().toLowerCase();
            const rf = roleSel.value;
            const list = grants.filter((g) => {
              const rid = g.user_id ? userRoleOf[g.user_id] : "";
              if (rf && rid !== rf) return false;
              if (!q) return true;
              const hay = [userOf[g.user_id] || "", displayOf[g.user_id] || ""].join(" ").toLowerCase();
              return hay.includes(q);
            });
            if (!list.length) {
              wrapBox.appendChild(emptyState(grants.length ? "No grants match." : "No grants yet. A (user, key) grant appears the first time that user is assigned the key at login."));
              return;
            }
            const { wrap, tbody } = table(["User", "Role", "Model", "Key", "Active"]);
            for (const g of list) {
              const row = el("tr");
              const user = g.user_id ? userById[g.user_id] : null;
              const who = el("div");
              const un = el("span", user ? "link" : "cell-main", user ? userOf[g.user_id] : (g.username || "—"));
              if (user) un.onclick = () => userDetails(user, { roles, balance: balanceOf[g.user_id] });
              who.appendChild(un);
              if (user && user.display_name) who.appendChild(el("div", "cell-sub", user.display_name));
              row.appendChild(td(who));
              const rid = g.user_id ? (userRoleOf[g.user_id] || "regular") : "—";
              row.appendChild(td(badge(roleNameOf[rid] || rid, rid === "admin" ? "danger" : roleKind(rid))));
              const models = g.credential_id ? modelsByCred[g.credential_id] || [] : [];
              const mCell = el("div");
              if (models.length) {
                for (const m of models.slice(0, 4)) {
                  const chip = el("span", "mini-chip link", m);
                  chip.onclick = () => credentialDetailModal(g.credential_id);
                  mCell.appendChild(chip);

              } else {
                mCell.appendChild(el("span", "muted", "—"));

              row.appendChild(td(mCell));
              const keyCell = el("div");
              if (g.credential_id) {
                const kbox = el("div");
                kbox.appendChild(el("span", "cell-main code", g.api_key ? maskKey(g.api_key) : (g.credential_name || g.credential_id.slice(0, 8))));
                if (g.credential_name) kbox.appendChild(el("div", "cell-sub", g.credential_name));
                keyCell.appendChild(kbox);
                if (g.api_key) {
                  const cp = el("button", "btn sm ghost", "Copy");
                  cp.onclick = async () => {
                    if (await copyText(g.api_key)) toast("LLM key copied to clipboard");
                    else toast("Copy failed — select manually", "err");
                  };
                  keyCell.appendChild(cp);
                }
              } else {
                keyCell.appendChild(el("span", "muted", "—"));
              }
              row.appendChild(td(keyCell));
              const tdSw = td();
              tdSw.appendChild(switchToggle(g.is_active, async (on) => {
                try {
                  await apiFetch("/admin/grants/" + g.id, { method: "PATCH", body: JSON.stringify({ is_active: on }) });
                  toast(on ? "Key granted" : "Key revoked for this user");
                  renderTokensPage();
                } catch (e) { toast(e.message, "err"); renderTokensPage(); }
              }));
              row.appendChild(tdSw);
              tbody.appendChild(row);
            }
            wrapBox.appendChild(wrap);
          };
          search.addEventListener("input", render);
          roleSel.addEventListener("change", render);
          render();

          try {
            [tokens, users, roles, wallets] = await Promise.all([
              apiFetch("/admin/tokens").then((d) => d.tokens || []),
              apiFetch("/admin/users").then((d) => d.users || []),
              apiFetch("/admin/roles").then((d) => d.roles || []),
              apiFetch("/admin/wallets").then((d) => d.wallets || []),

            displayOf[u.id] = u.display_name;
            userById[u.id] = u;
          }
          for (const w of wallets) balanceOf[w.user_id] = w.balance;
          // Effective role: per-token role_id override → the user's role → token kind.

          container.appendChild(bar);

          container.appendChild(help);

          const search = textInput("", { placeholder: "Search by person or token name…" });
          const roleSel = select([{ value: "", label: "role: all" }, ...roles.map((r) => ({ value: r.role_id, label: r.role_id }))], "");
          const filters = el("div", "filter-bar");

          container.appendChild(wrapBox);

            const rf = roleSel.value;
            const list = tokens.filter((tk) => {

              if (!q) return true;
              const hay = [userOf[tk.user_id] || "", displayOf[tk.user_id] || "", tk.name || ""].join(" ").toLowerCase();

            if (!list.length) {
              wrapBox.appendChild(emptyState(tokens.length ? "No logins match." : "No login credentials yet."));

            }

            for (const tk of list) {

              const tdSw = td();
              tdSw.appendChild(switchToggle(tk.is_active, async (on) => {
                try {
                  await apiFetch("/admin/tokens/" + tk.id, { method: "PATCH", body: JSON.stringify({ is_active: on }) });

            wrapBox.appendChild(wrap);

          search.addEventListener("input", render);
          roleSel.addEventListener("change", render);
          render();

        function tokenForm(ctx) {
          const name = textInput("", { placeholder: "e.g. ci-robot" });
          const roleSel = select([
            { value: "user", label: "user — bound to an account" },
            { value: "admin", label: "admin — unrestricted" },
          ], "user");
          const userSel = select(ctx.users.map((u) => ({ value: u.id, label: u.username || u.id.slice(0, 8) })), "");
          const roleIdSel = select([{ value: "", label: "(inherit the user's role)" }, ...ctx.roles.map((r) => ({ value: r.role_id, label: r.role_id }))], "");
          const expirySel = select([
            { value: "7", label: "7 days" },
            { value: "30", label: "30 days" },
            { value: "90", label: "90 days" },
            { value: "never", label: "Never expires" },
          ], "30");

          const userField = field("User", userSel, "Required for user tokens.");
          const roleIdField = field("Role override", roleIdSel, "Optional quota-role override.");
          const userBlock = el("div");
          userBlock.append(userField, roleIdField);
          const sync = () => {
            userBlock.style.display = roleSel.value === "user" ? "" : "none";
          };
          roleSel.addEventListener("change", sync);
          sync();

          const body = el("div");
          body.append(
            field("Name", name),
            field("Role", roleSel),
            userBlock,
            field("Expiry", expirySel)
          );

          const foot = drawerFoot();
          const save = el("button", "btn primary", "Generate");
          save.onclick = async () => {
            if (!name.value.trim()) { toast("Token name is required", "err"); return; }
            save.disabled = true;
            const payload = { name: name.value.trim(), role: roleSel.value };
            if (roleSel.value === "user") {
              if (!userSel.value) { toast("Select a user for user tokens", "err"); save.disabled = false; return; }
              payload.user_id = userSel.value;
              if (roleIdSel.value) payload.role_id = roleIdSel.value;
            }
            if (expirySel.value !== "never") {
              payload.expires_at = new Date(Date.now() + parseInt(expirySel.value, 10) * 86400000).toISOString();
            }
            try {
              const d = await apiFetch("/admin/tokens", { method: "POST", body: JSON.stringify(payload) });
              drawer.close();
              revealTokenModal(d.token, d.name, d.role);
              renderTokensPage();
            } catch (e) { toast(e.message, "err"); }
            save.disabled = false;
          };
          foot.appendChild(save);
          openDrawer({ title: "Generate token", subtitle: "Raw value shown once", body, footer: foot });
        }

        function revealTokenModal(raw, name, role) {
          const overlay = el("div", "overlay center");
          const card = el("div", "modal-card");
          card.appendChild(el("h3", "modal-title", "Token created"));
          card.appendChild(el("p", "confirm-text", `"${name}" (${role}) is shown only once — copy it now.`));
          const box = el("div", "reveal-box");
          const code = el("span", "", raw);
          const copyBtn = el("button", "btn sm ghost", "Copy");
          copyBtn.onclick = async () => {
            if (await copyText(raw)) toast("Token copied to clipboard");
            else toast("Copy failed — select and copy manually", "err");
          };
          box.append(code, copyBtn);
          card.appendChild(box);
          const foot = el("div", "modal-foot");
          const done = el("button", "btn primary", "Done");
          done.onclick = () => overlay.remove();
          foot.appendChild(done);
          card.appendChild(foot);
          overlay.appendChild(card);
          document.body.appendChild(overlay);
        }

        async function deleteToken(tk) {
          if (!(await confirmDialog(`Delete token "${tk.name}"?`, "Delete token"))) return;
          try {
            await apiFetch("/admin/tokens/" + tk.id, { method: "DELETE" });
            toast("Token deleted");
            renderTokensPage();
          } catch (e) { toast(e.message, "err"); }
        }

        // ───────────────────────── wire up ─────────────────────────
        document.getElementById("login-btn").addEventListener("click", login);
        document.getElementById("login-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
        document.getElementById("logout-btn").addEventListener("click", logout);
        document.getElementById("refresh-btn").addEventListener("click", () => navigate());
        document.querySelectorAll(".nav-item").forEach((n) => {
          n.addEventListener("click", () => { location.hash = n.dataset.page; });
        });
        window.addEventListener("hashchange", navigate);

        // appearance wiring
        const settingsBtn = document.getElementById("settings-btn");
        const settingsBackdrop = document.getElementById("settings-backdrop");
        const settingsPop = document.getElementById("settings-pop");
        const settingsFont = document.getElementById("settings-font");

        function openSettings(open) {
          settingsPop.classList.toggle("hidden", !open);
          settingsBackdrop.classList.toggle("hidden", !open);
        }
        settingsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openSettings(settingsPop.classList.contains("hidden"));
        });
        settingsBackdrop.addEventListener("click", () => openSettings(false));
        document.querySelectorAll("[data-theme-opt]").forEach((b) => {
          b.addEventListener("click", () => {
            theme = b.dataset.themeOpt;
            writePref(THEME_KEY, theme);
            applyTheme(theme);
            openSettings(false);
          });
        });
        settingsFont.addEventListener("change", () => {
          fontSize = parseInt(settingsFont.value, 10) || 14;
          writePref(FONT_KEY, String(fontSize));
          applyFontSize(fontSize);
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !settingsPop.classList.contains("hidden")) openSettings(false);
        });
        if (window.matchMedia) {
          try {
            window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
              if (theme === "system") applyTheme("system");
            });
          } catch { /* ignore */ }
        }

        boot();
      })();
    </script>
  </body>
</html>
