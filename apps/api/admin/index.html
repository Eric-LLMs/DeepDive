          const stateFilter = select([{ value: "", label: "All states" }, { value: "active", label: "Active" }, { value: "inactive", label: "Inactive" }], "");

          const listEl = el("div");
          const renderList = () => {
            listEl.innerHTML = "";
            const q = kw.value.trim().toLowerCase();
            const filtered = users.filter((u) => {
              if (roleFilter.value && u.role_id !== roleFilter.value) return false;
              if (stateFilter.value === "active" && !u.is_active) return false;
              if (stateFilter.value === "inactive" && u.is_active) return false;
              if (q && !((u.username || "").toLowerCase().includes(q) || (u.display_name || "").toLowerCase().includes(q) || u.id.includes(q))) return false;
              return true;
            });
            if (!filtered.length) { listEl.appendChild(emptyState("No users match.")); return; }
            const { wrap, tbody } = table(["User", "Role", "Wallet", "Active", "Created", ""]);
            for (const u of filtered) {
              const row = el("tr");
              const who = el("div");
              const un = el("span", "link", u.username || "—");
              un.onclick = () => userDetails(u, { roles, balance: balanceOf[u.id] });
              who.appendChild(un);
              if (u.display_name) who.appendChild(el("div", "cell-sub", u.display_name));
              who.appendChild(el("div", "cell-sub", u.id.slice(0, 8) + "…"));
              row.appendChild(td(who));
              row.appendChild(td(roleBadge(u.role_id)));
              row.appendChild(td(fmtMoney(balanceOf[u.id])));
              const tdSw = td();
              tdSw.appendChild(switchToggle(u.is_active, async (on) => {
                try {
                  await apiFetch("/admin/users/" + u.id, { method: "PATCH", body: JSON.stringify({ is_active: on }) });
                  toast("User updated");
                  renderUsersPage();
                } catch (e) { toast(e.message, "err"); renderUsersPage(); }
              }));
              row.appendChild(tdSw);
              row.appendChild(td(el("span", "muted", fmtDate(u.created_at))));
              row.appendChild(td(actionBtns([
                { label: "Details", onClick: () => userDetails(u, { roles, balance: balanceOf[u.id] }) },
                { label: "Edit", onClick: () => userForm(u, { roles }) },
                { label: "Delete", danger: true, onClick: () => deleteUser(u) },
              ])));
              tbody.appendChild(row);
            }
            listEl.appendChild(wrap);
          };

          kw.addEventListener("input", renderList);
          roleFilter.addEventListener("change", renderList);
          stateFilter.addEventListener("change", renderList);

          const bar = el("div", "bar-row");
          const title = el("div", "bar-title", "Users ");
          title.appendChild(el("span", "count", "(" + users.length + ")"));
          const add = el("button", "btn primary", "+ New user");
          add.onclick = () => userForm(null, { roles });
          bar.append(title, add);
          section.appendChild(bar);

          const fb = el("div", "filter-bar");
          fb.append(kw, roleFilter, stateFilter);
          section.appendChild(fb);
          section.appendChild(listEl);
          renderList();
        }

        function userForm(user, ctx) {
          const isEdit = !!user;
          const username = textInput(isEdit ? user.username || "" : "", { placeholder: "Username" });
          const password = textInput("", { type: "password", placeholder: isEdit ? "Leave empty to keep" : "Initial password" });
          const PW_POLICY = "At least 8 characters, with uppercase, lowercase, a digit and a special character";
          const display = textInput(isEdit ? user.display_name || "" : "", { placeholder: "Display name (optional)" });
          const roleSel = select(ctx.roles.map((r) => ({ value: r.role_id, label: r.role_id })), isEdit ? user.role_id : "");
          const active = switchToggle(isEdit ? user.is_active : true);

          const body = el("div");
          body.append(
            field("Username", username, isEdit ? "Not editable." : "Required."),
            field("Password", password, isEdit ? "Blank keeps the current password. " + PW_POLICY : "Required. " + PW_POLICY),
            field("Display name", display),
            field("Role", roleSel)
          );
          if (isEdit) {
            const activeRow = el("div", "switch-row");
            activeRow.append(active, el("span", "muted", "Allow sign-in"));
            body.appendChild(field("Active", activeRow));
          }

          const foot = drawerFoot();
          const save = el("button", "btn primary", isEdit ? "Save changes" : "Create user");
          save.onclick = async () => {
            if (!username.value.trim()) { toast("Username is required", "err"); return; }
            if (!isEdit && !password.value) { toast("Initial password is required", "err"); return; }
            save.disabled = true;
            try {
              if (isEdit) {
                const payload = { display_name: display.value.trim() || null, role_id: roleSel.value };
                if (password.value) payload.password = password.value;
                payload.is_active = active.classList.contains("on");
                await apiFetch("/admin/users/" + user.id, { method: "PATCH", body: JSON.stringify(payload) });
              } else {
                await apiFetch("/admin/users", {
                  method: "POST",
                  body: JSON.stringify({
                    username: username.value.trim(),
                    password,
                    display_name: display.value.trim() || null,
                    role_id: roleSel.value,
                  }),
                });
              }
              toast(isEdit ? "User saved" : "User created");
              drawer.close();
              renderUsersPage();
            } catch (e) { toast(e.message, "err"); }
            save.disabled = false;
          };
          foot.appendChild(save);
          const drawer = openDrawer({ title: isEdit ? "Edit user" : "New user", subtitle: isEdit ? user.username : "Create an account", body, footer: foot });
        }

        async function deleteUser(u) {
          if (!(await confirmDialog(`Delete user "${u.username || u.id}"? Their wallet and usage records are removed too.`, "Delete user"))) return;
          try {
            await apiFetch("/admin/users/" + u.id, { method: "DELETE" });
            toast("User deleted");
            renderUsersPage();
          } catch (e) { toast(e.message, "err"); }
        }

        async function userDetails(user, ctx) {
          const body = el("div");
          body.innerHTML = '<div class="loading">Loading…</div>';
          const drawer = openDrawer({ title: user.username || "User", subtitle: user.id, body, width: "wide" });

          let usage;
          try {
            usage = await apiFetch("/admin/users/" + user.id + "/usage");
          } catch (e) {
            body.innerHTML = "";
            body.appendChild(errBox(e));
            return;
          }
          body.innerHTML = "";

          const profile = el("div", "legacy-card");
          const pTitle = el("div", "bar-title", "Profile");
          const chips = el("div");
          chips.style.marginTop = "8px";
          chips.appendChild(roleBadge(user.role_id));
          chips.appendChild(badge(user.is_active ? "active" : "inactive", user.is_active ? "ok" : "danger"));
          if (user.display_name) chips.appendChild(badge(user.display_name));
          profile.append(pTitle, chips);
          const details = el("div", "kbd-note");
          details.style.marginTop = "8px";
          details.textContent = "Created " + fmtDate(user.created_at) + " · id " + user.id;
          profile.appendChild(details);
          body.appendChild(profile);

          // wallet + topup
          const wallet = el("div", "legacy-card");
          const wTitle = el("div", "bar-title", "Wallet");
          const bal = el("div", "cell-main");
          bal.style.fontSize = "20px";
          bal.textContent = fmtMoney(ctx.balance);
          wallet.appendChild(wTitle);
          wallet.appendChild(bal);

          const amount = numInput("", { step: "0.000001", placeholder: "Amount (USD)" });
          const note = textInput("", { placeholder: "Note (optional)" });
          const top = el("button", "btn primary", "Top up");
          top.onclick = async () => {
            const amt = parseFloat(amount.value || "0");
            if (amt <= 0) { toast("Amount must be positive", "err"); return; }
            top.disabled = true;
            try {
              await apiFetch("/admin/wallets/topup", { method: "POST", body: JSON.stringify({ user_id: user.id, amount: amt, description: note.value.trim() || "admin topup" }) });
              toast("Wallet credited");
              drawer.close();
              navigate();
            } catch (e) { toast(e.message, "err"); }
            top.disabled = false;
          };
          const topRow = el("div", "row-actions");
          topRow.append(amount, note, top);
          wallet.appendChild(topRow);
          body.appendChild(wallet);

          // usage counters
          const counters = usage.counters || [];
          if (counters.length) {
            const cSec = el("div", "section-title", "Usage — last " + counters.length + " days");
            body.appendChild(cSec);
            const { wrap, tbody } = table(["Day", "Requests", "Tokens"]);
            for (const c of counters) {
              const row = el("tr");
              row.appendChild(td(el("span", "code", c.period_start.slice(0, 10))));
              row.appendChild(td(String(c.request_count)));
              row.appendChild(td(String(c.token_count)));
              tbody.appendChild(row);
            }
            body.appendChild(wrap);
          }

          // cost by channel — aggregate cost per serving credential (all time)
          body.appendChild(el("div", "section-title", "Cost by channel"));
          const bcBox = el("div");
          bcBox.innerHTML = '<div class="loading">Loading…</div>';
          body.appendChild(bcBox);
          (async () => {
            try {
              const d = await apiFetch("/admin/usage/by-channel");
              const chans = d.channels || [];
              bcBox.innerHTML = "";
              if (!chans.length) {
                bcBox.appendChild(emptyState("No usage yet."));
              } else {
                const { wrap, tbody } = table(["Channel", "Requests", "Tokens", "Cost"]);
                for (const c of chans) {
                  const row = el("tr");
                  row.appendChild(td(c.credential_name || el("span", "muted", "Unknown channel")));
                  row.appendChild(td(String(c.request_count)));
                  row.appendChild(td(String(c.total_tokens)));
                  row.appendChild(td(fmtMoney(c.total_cost)));
                  tbody.appendChild(row);
                }
                bcBox.appendChild(wrap);
              }
            } catch (e) { bcBox.innerHTML = ""; bcBox.appendChild(errBox(e)); }
          })();

          // transactions
          const txs = usage.transactions || [];
          if (txs.length) {
            body.appendChild(el("div", "section-title", "Recent transactions"));
            const { wrap, tbody } = table(["Type", "Amount", "Balance after", "Note", "When"]);
            for (const tx of txs) {
              const row = el("tr");
              const kind = tx.type === "topup" ? "ok" : tx.amount < 0 ? "danger" : "";
              row.appendChild(td(badge(tx.type, kind)));
              row.appendChild(td((tx.amount < 0 ? "-" : "+") + fmtMoney(Math.abs(tx.amount))));
              row.appendChild(td(fmtMoney(tx.balance_after)));
              row.appendChild(td(el("span", "muted", tx.description || "—")));
              row.appendChild(td(el("span", "muted", fmtDate(tx.created_at))));
              tbody.appendChild(row);
            }
            body.appendChild(wrap);
          }

          // usage logs — paginated + filterable (from-date, fuzzy model name)
          body.appendChild(el("div", "section-title", "Usage logs"));
          const lf = el("div", "filter-bar");
          const startIn = textInput("", { type: "date" });
          const endIn = textInput("", { type: "date" });
          const modelIn = textInput("", { placeholder: "Model (fuzzy)…" });
          const searchBtn = el("button", "btn sm primary", "Search");
          lf.append(el("span", "muted", "From"), startIn, el("span", "muted", "To"), endIn, modelIn, searchBtn);
          body.appendChild(lf);
          const lres = el("div");
          body.appendChild(lres);
          const PER = 20;
          let page = 0;
          async function loadLogs() {
            lres.innerHTML = '<div class="loading">Loading…</div>';
            const q = new URLSearchParams({ limit: String(PER), offset: String(page * PER) });
            // local "YYYY-MM-DD" → local midnight → UTC ISO.
            // From = selected date 00:00:00; To = next-day 00:00:00 (half-open range).
            if (startIn.value) q.set("start", new Date(startIn.value + "T00:00:00").toISOString());
            if (endIn.value) {
              const end = new Date(endIn.value + "T00:00:00");
              end.setDate(end.getDate() + 1);
              q.set("end", end.toISOString());
            }
            const m = modelIn.value.trim();
            if (m) q.set("model", m);
            let d;
            try { d = await apiFetch("/admin/users/" + user.id + "/usage?" + q); }
            catch (e) { lres.innerHTML = ""; lres.appendChild(errBox(e)); return; }
            const logs = d.logs || [];
            const total = d.total || 0;
            lres.innerHTML = "";
            if (!logs.length) {
              lres.appendChild(emptyState(total ? "No logs match." : "No usage logs yet."));
            } else {
              const { wrap, tbody } = table(["When", "Channel model name", "Channel", "Tool", "Tokens", "Cost"]);
              for (const l of logs) {
                const row = el("tr");
                row.appendChild(td(el("span", "muted", fmtDate(l.created_at))));
                const mCell = td();
                if (l.model_name) {
                  const link = el("a", "link", l.model_name);
                  link.href = "javascript:void(0)";
                  link.title = "View model detail";
                  link.onclick = async () => {
                    try {
                      const models = (await apiFetch("/admin/models")).models || [];
                      const m = models.find((x) => x.name === l.model_name);
                      if (m) modelDetailModal(m);
                      else toast("Model not in catalog", "err");
                    } catch (e) { toast(e.message, "err"); }
                  };
                  mCell.appendChild(link);
                } else {
                  mCell.appendChild(el("span", "muted", "—"));
                }
                row.appendChild(mCell);
                row.appendChild(td(l.credential_name ? el("span", "muted", l.credential_name) : el("span", "muted", "—")));
                row.appendChild(td(l.tool || "—"));
                row.appendChild(td(String(l.total_tokens ?? (l.prompt_tokens + " / " + l.completion_tokens))));
                row.appendChild(td(fmtMoney(l.cost_usd)));
                tbody.appendChild(row);
              }
              lres.appendChild(wrap);
            }
            const pages = Math.max(1, Math.ceil(total / PER));
            const pg = el("div", "row-actions");
            const prev = el("button", "btn sm ghost", "‹ Prev");
            prev.disabled = page <= 0;
            prev.onclick = () => { if (page > 0) { page--; loadLogs(); } };
            const next = el("button", "btn sm ghost", "Next ›");
            next.disabled = page + 1 >= pages;
            next.onclick = () => { if (page + 1 < pages) { page++; loadLogs(); } };
            pg.append(prev, el("span", "muted", "Page " + (page + 1) + " / " + pages + " · " + total + " records"), next);
            lres.appendChild(pg);
          }
          searchBtn.onclick = () => { page = 0; loadLogs(); };
          loadLogs();
        }

        // ───────────────────────── TOKENS ─────────────────────────
        let tokenTab = "relations";

        async function renderTokensPage() {
          content.innerHTML = "";
          const head = el("div", "page-head");
          const t = el("div");
          t.appendChild(el("h2", "", "Tokens"));
          t.appendChild(el("div", "sub", "LLM-key grants (which key a user may use) + login credentials (who can sign in) — the two are independent"));
          head.appendChild(t);
          content.appendChild(head);

          const tabs = el("div", "tabs");
          for (const [key, label] of [["relations", "Channels & Relations"], ["keys", "LLM Keys"], ["logins", "Login Credentials"]]) {
            const tab = el("div", "tab" + (tokenTab === key ? " active" : ""), label);
            tab.onclick = () => { tokenTab = key; renderTokensPage(); };
            tabs.appendChild(tab);
          }
          content.appendChild(tabs);

          const section = el("div");
          content.appendChild(section);
          if (tokenTab === "relations") await renderTokenRelations(section);
          else if (tokenTab === "keys") await renderGrantsTab(section);
          else await renderLoginsTab(section);
        }

        // ── Tab 1: channel ↔ role ↔ user relationship browser ──
        async function renderTokenRelations(container) {
          container.innerHTML = '<div class="loading">Loading…</div>';
          let rel;
          try {
            rel = await apiFetch("/admin/tokens/relations");
          } catch (e) { container.innerHTML = ""; container.appendChild(errBox(e)); return; }
          const roles = rel.roles || [];
          const creds = rel.credentials || [];
          container.innerHTML = "";

          const bar = el("div", "filter-bar");
          const roleSel = select([{ value: "", label: "role: all" }, ...roles.map((r) => ({ value: r.role_id, label: r.role_id }))], "");
          const credSel = select([{ value: "", label: "channel: all" }, ...creds.map((c) => ({ value: c.id, label: c.name }))], "");
          bar.append(roleSel, credSel);
          container.appendChild(bar);

          const panel = el("div");
          container.appendChild(panel);

          const pickRole = (id) => { roleSel.value = id; render(); };
          const pickCred = (id) => { credSel.value = id; render(); };
          const render = () => {
            panel.innerHTML = "";
            const rf = roleSel.value, cf = credSel.value;
            if (rf) renderRelRole(panel, rel, roles.find((r) => r.role_id === rf), { pickCred });
            else if (cf) renderRelCred(panel, rel, creds.find((c) => c.id === cf), { pickRole });
            else renderRelAll(panel, rel, { pickRole, pickCred });
          };
          roleSel.addEventListener("change", render);
          credSel.addEventListener("change", render);
          render();
        }

        function renderRelAll(panel, rel, nav) {
          const creds = rel.credentials || [];
          const roles = rel.roles || [];
          const title = el("div", "section-title", "Channels ");
          title.appendChild(el("span", "muted", creds.length + " provider channels — click a name for detail"));
          panel.appendChild(title);
          if (!creds.length) { panel.appendChild(emptyState("No provider channels yet.")); }
          else {
            const grid = el("div", "chan-grid");
            for (const c of creds) {
              const card = el("div", "chan-card");
              const top = el("div", "top");
              const nm = el("span", "cell-main", c.name);
              nm.style.cursor = "pointer";
              nm.onclick = () => credentialDetailModal(c.id);
              top.append(nm, c.is_active ? badge("active", "ok") : badge("inactive", "danger"));
              card.appendChild(top);
              card.appendChild(el("div", "cell-sub code", c.base_url));
              const meta = el("div", "cell-sub");
              meta.appendChild(el("span", "mini-chip", (c.model_count || 0) + " routes"));
              meta.appendChild(el("span", "mini-chip", priceText(c.price_prompt_min, c.price_prompt_max)));
              card.appendChild(meta);
              if (c.roles && c.roles.length) {
                const rt = el("div", "cell-sub");
                rt.appendChild(el("span", "", "roles: "));
                for (const rid of c.roles) {
                  const chip = el("span", "mini-chip", rid);
                  chip.style.cursor = "pointer";
                  chip.onclick = () => nav.pickRole(rid);
                  rt.appendChild(chip);
                }
                card.appendChild(rt);
              }
              grid.appendChild(card);
            }
            panel.appendChild(grid);
          }

          panel.appendChild(el("div", "section-title", "Roles → channels"));
          const { wrap, tbody } = table(["Role", "Bound channels"]);
          for (const r of roles) {
            const row = el("tr");
            const who = el("div");
            who.appendChild(el("span", "cell-main", r.role_id));
            if (r.role_name) who.appendChild(el("div", "cell-sub", r.role_name));
            row.appendChild(td(who));
            const cc = el("div");
            for (const c of (r.credentials || [])) {
              const chip = el("span", "mini-chip", c.name);
              chip.style.cursor = "pointer";
              chip.onclick = () => nav.pickCred(c.id);
              cc.appendChild(chip);
            }
            const manage = el("button", "btn sm ghost", "manage");
            manage.type = "button";
            manage.onclick = () => channelPickerModal(r.role_id, r.role_name, r.credentials || []);
            if ((r.credentials || []).length) {
              cc.appendChild(manage);
              row.appendChild(td(cc));
            } else {
              row.appendChild(td(manage));
            }
            tbody.appendChild(row);
          }
          panel.appendChild(wrap);
        }

        function renderRelRole(panel, rel, role, nav) {
          if (!role) { panel.appendChild(emptyState("Role not found")); return; }
          const card = el("div", "rel-card");
          const h = el("h4");
          h.append(badge(role.role_id, roleKind(role.role_id)), role.is_active ? badge("active", "ok") : badge("inactive", "danger"));
          card.appendChild(h);
          panel.appendChild(card);

          panel.appendChild(el("div", "section-title", "Bound channels"));
          const manage = el("button", "btn sm ghost", "Manage channels");
          manage.type = "button";
          manage.onclick = () => channelPickerModal(role.role_id, role.role_name, role.credentials || []);

          if (!(role.credentials || []).length) { panel.appendChild(emptyState("No channels bound to this role yet.")); }

        function renderRelCred(panel, rel, cred, nav) {
          if (!cred) { panel.appendChild(emptyState("Channel not found")); return; }
          const card = el("div", "rel-card");
          const h = el("h4");
          h.append(cred.name, cred.is_active ? badge("active", "ok") : badge("inactive", "danger"));
          card.appendChild(h);
          card.appendChild(detailRow("Base URL", cred.base_url));
          card.appendChild(detailRow("Routes", (cred.model_count || 0) + " routed"));

          card.appendChild(detailRow("Completion $/1k", priceText(cred.price_completion_min, cred.price_completion_max)));

          detail.onclick = () => credentialDetailModal(cred.id);

        // ── Tab 2: LLM-key grants (which key a user may use; access_tokens) ──
        async function renderGrantsTab(container) {
          container.innerHTML = '<div class="loading">Loading…</div>';
          let grants, users, roles, routes, wallets;
          try {
            [grants, users, roles, routes, wallets] = await Promise.all([
              apiFetch("/admin/grants").then((d) => d.grants || []),
              apiFetch("/admin/users").then((d) => d.users || []),
              apiFetch("/admin/roles").then((d) => d.roles || []),
              apiFetch("/admin/routes").then((d) => d.routes || []),
              apiFetch("/admin/wallets").then((d) => d.wallets || []),
            ]);
          } catch (e) { container.innerHTML = ""; container.appendChild(errBox(e)); return; }
          container.innerHTML = "";

          const userOf = {}, userRoleOf = {}, displayOf = {}, userById = {}, balanceOf = {};
          for (const u of users) {
            userOf[u.id] = u.username;
            userRoleOf[u.id] = u.role_id;
            displayOf[u.id] = u.display_name;
            userById[u.id] = u;
          }
          for (const w of wallets) balanceOf[w.user_id] = w.balance;
          const roleNameOf = {};
          for (const r of roles) roleNameOf[r.role_id] = r.role_name || r.role_id;
          // Models each key channel serves (via routes) → chips in the Model column.
          const modelsByCred = {};
          for (const r of routes) {
            (modelsByCred[r.credential_id] = modelsByCred[r.credential_id] || []).push(r.model_name || "?");
          }

          const bar = el("div", "bar-row");
          const title = el("div", "bar-title", "LLM key grants ");
          title.appendChild(el("span", "count", "(" + grants.length + ")"));
          bar.append(title);
          container.appendChild(bar);

              apiFetch("/admin/users").then((d) => d.users || []),

          for (const w of wallets) balanceOf[w.user_id] = w.balance;
          // Effective role: per-token role_id override → the user's role → token kind.

          const search = textInput("", { placeholder: "Search by person or token name…" });

        function tokenForm(ctx) {
          const name = textInput("", { placeholder: "e.g. ci-robot" });
          const roleSel = select([
            { value: "user", label: "user — bound to an account" },
            { value: "admin", label: "admin — unrestricted" },
          ], "user");
          const userSel = select(ctx.users.map((u) => ({ value: u.id, label: u.username || u.id.slice(0, 8) })), "");
          const roleIdSel = select([{ value: "", label: "(inherit the user's role)" }, ...ctx.roles.map((r) => ({ value: r.role_id, label: r.role_id }))], "");
          const expirySel = select([
            { value: "7", label: "7 days" },
            { value: "30", label: "30 days" },
            { value: "90", label: "90 days" },
            { value: "never", label: "Never expires" },
          ], "30");

          const userField = field("User", userSel, "Required for user tokens.");
          const roleIdField = field("Role override", roleIdSel, "Optional quota-role override.");
          const userBlock = el("div");
          userBlock.append(userField, roleIdField);
          const sync = () => {
            userBlock.style.display = roleSel.value === "user" ? "" : "none";
          };
          roleSel.addEventListener("change", sync);
          sync();

          const body = el("div");
          body.append(
            field("Name", name),
            field("Role", roleSel),
            userBlock,
            field("Expiry", expirySel)
          );

          const foot = drawerFoot();
          const save = el("button", "btn primary", "Generate");
          save.onclick = async () => {
            if (!name.value.trim()) { toast("Token name is required", "err"); return; }
            save.disabled = true;
            const payload = { name: name.value.trim(), role: roleSel.value };
            if (roleSel.value === "user") {
              if (!userSel.value) { toast("Select a user for user tokens", "err"); save.disabled = false; return; }
              payload.user_id = userSel.value;
              if (roleIdSel.value) payload.role_id = roleIdSel.value;
            }
            if (expirySel.value !== "never") {
              payload.expires_at = new Date(Date.now() + parseInt(expirySel.value, 10) * 86400000).toISOString();
            }
            try {
              const d = await apiFetch("/admin/tokens", { method: "POST", body: JSON.stringify(payload) });
              drawer.close();
              revealTokenModal(d.token, d.name, d.role);
              renderTokensPage();
            } catch (e) { toast(e.message, "err"); }
            save.disabled = false;
          };
          foot.appendChild(save);
          openDrawer({ title: "Generate token", subtitle: "Raw value shown once", body, footer: foot });
        }

        function revealTokenModal(raw, name, role) {

          settingsPop.classList.toggle("hidden", !open);
          settingsBackdrop.classList.toggle("hidden", !open);
        }
        settingsBtn.addEventListener("click", (e) => {
          e.stopPropagation();

        // ── Tab 1: live test (per-node trace) ──
        async function renderRagTest(container) {
          container.innerHTML = "";
          const card = el("div", "legacy-card");
          card.appendChild(el("div", "bar-title", "Test — run the configured pipeline stage by stage"));
          card.appendChild(el("div", "kbd-note", "Runs your query through every enabled node in order and shows what each stage produced (status / timing / output). Hits are the final fused and reranked chunks."));

          const query = el("textarea");
          query.rows = 2;
          query.placeholder = "e.g. what is attention in transformers";
          const topK = numInput(5);
          const domain = textInput("", { placeholder: "optional domain UUID" });
          const row1 = el("div", "chat-test-row");
          row1.append(field("Query", query), field("Top-K", topK), field("Domain ID", domain));
          card.appendChild(row1);

          const run = el("button", "btn primary", "Run pipeline");
          const res = el("div", "test-res");
          card.append(run, res);
          container.appendChild(card);
          const out = el("div");
          container.appendChild(out);

          run.onclick = async () => {
            run.disabled = true;
            run.textContent = "Running…";
            res.textContent = "";
            out.innerHTML = "";
            const payload = {
              query: query.value.trim(),
              top_k: parseInt(topK.value || "5", 10),
              domain_id: domain.value.trim() || null,
            };
            try {
              const d = await apiFetch("/admin/rag/test", { method: "POST", body: JSON.stringify(payload) });
              if (!d.ok) {
                res.textContent = "✗ " + (d.error || "unavailable");
                res.className = "test-res err";
                return;
              }
              res.textContent = "✓ " + (d.hits || []).length + " hits · " + (d.trace || []).length + " nodes";
              res.className = "test-res ok";

              const traceCard = el("div", "legacy-card");
              traceCard.appendChild(el("div", "bar-title", "Node trace"));
              for (const tr of d.trace || []) {
                const p = el("div", "node-trace");
                const h = el("div", "trace-head");
                h.appendChild(el("span", "cell-main code", tr.name));
                h.appendChild(badge(tr.status, tr.status === "OK" ? "ok" : tr.status === "SKIP" ? "" : "danger"));
                h.appendChild(el("span", "trace-ms", tr.ms != null ? tr.ms + " ms" : ""));
                p.appendChild(h);
                if (tr.out !== undefined && tr.out !== null && tr.out !== "") {
                  const outText = (typeof tr.out === "object")
                    ? JSON.stringify(tr.out, null, 2)
                    : String(tr.out);
                  p.appendChild(el("pre", "trace-out", outText));
                }
                traceCard.appendChild(p);
              }
              out.appendChild(traceCard);

              if ((d.errors || []).length) {
                const errCard = el("div", "legacy-card");
                errCard.appendChild(el("div", "bar-title", "Errors"));
                for (const e of d.errors) errCard.appendChild(el("div", "trace-out err", e));
                out.appendChild(errCard);

              const hitsCard = el("div", "legacy-card");

              if (!(d.hits || []).length) {
                hitsCard.appendChild(emptyState("No hits — check node errors above."));
              } else {
                const { wrap, tbody } = table(["#", "score", "asset", "text"]);
                (d.hits || []).forEach((hit, i) => {
                  const tr = el("tr");
                  tr.appendChild(td(String(i + 1)));
                  tr.appendChild(td(hit.score != null ? hit.score.toFixed(4) : "—"));
                  tr.appendChild(td((hit.meta && hit.meta.asset_id) || "—"));
                  // Show the full hit text (scrollable cell) so a test result reads the
                  // whole chunk — truncating to 180 chars made long replies look empty.
                  const cell = el("td", "hit-text");

                  pre.textContent = String(hit.text || "");

              res.textContent = "✗ " + e.message;
              res.className = "test-res err";

            run.disabled = false;
            run.textContent = "Run pipeline";
          };

        // ── Tab 3: pipeline config (node list IS the topology) ──
        async function renderRagNodes(container) {
          container.innerHTML = '<div class="loading">Loading…</div>';
          let data;
          try {
            data = await apiFetch("/admin/rag/config");
          } catch (e) { container.innerHTML = ""; container.appendChild(errBox(e)); return; }
          container.innerHTML = "";

          const cfg = data.config || { nodes: [], chunking: {}, contextual: false, parent_child: false, cjk: false };
          const available = data.available_nodes || [];
          const metaByName = {};
          for (const m of available) metaByName[m.name] = m;

          // If no node list is stored (or it was saved empty), fall back to the
          // default order so the topology stays visible instead of collapsing to
          // a bare "Add node…" dropdown.
          if (!cfg.nodes || cfg.nodes.length === 0) {
            cfg.nodes = [
              { name: "query_rewrite", enabled: true, params: {} },

        // ── Capability PATCH (live row) with optimistic concurrency ──
        async function regPatch(capabilityId, patch, note) {

          try {
            const res = await apiFetch("/admin/registry/capabilities/" + encodeURIComponent(capabilityId), {
              method: "PATCH",
              body: JSON.stringify({ patch, expected_row_version: cap ? cap.row_version : 0 }),
            });
            const i = regCaps.findIndex((x) => x.capability_id === capabilityId);
            if (i >= 0 && res && res.capability) regCaps[i] = res.capability;
            toast("Saved (live): " + capabilityId + (note ? " — " + note : ""), "ok");

            toast(e.message, "error");

          await renderRegistryPage();

        async function qcWrite(url, opts, okMsg, onDone) {

        function qcRow(row, { lang, text, embedded, enabled, onEditText, onToggle, onDelete, parent }) {
          row.appendChild(el("span", "qc-lang", lang || qcLang(text)));
          if (parent) row.appendChild(el("span", "hint", "↳ " + parent));
          const cell = el("div", "qc-text-cell", text);
          cell.style.cssText = "white-space:normal;flex:1";
          row.appendChild(cell);
          if (embedded === false) row.appendChild(el("span", "badge warn", "no vector — backfill"));
          if (!enabled) row.appendChild(el("span", "badge", "disabled"));
          if (onEditText) {
            const edit = el("button", "btn ghost sm qc-edit-btn", "Edit");
            edit.type = "button";
            edit.onclick = () => {
              cell.innerHTML = "";
              const inp = textInput(text);
              inp.style.flex = "1";
              const save = el("button", "btn primary sm", "Save");
              const cancel = el("button", "btn ghost sm", "Cancel");
              save.type = cancel.type = "button";
              cancel.onclick = () => { cell.textContent = text; };
              save.onclick = () => onEditText(inp.value.trim(), () => { text = inp.value.trim(); cell.textContent = text; });
              const rw = el("div", "row-actions"); rw.append(inp, save, cancel);
              cell.appendChild(rw);
            };
            row.appendChild(edit);
          }
          if (onToggle) {
            const tg = el("button", "btn ghost sm", enabled ? "Disable" : "Enable");
            tg.type = "button";
            tg.onclick = () => onToggle(!enabled);
            row.appendChild(tg);
          }
          if (onDelete) {
            let armed = false;
            const del = el("button", "btn ghost sm", "✕");
            del.type = "button";
            del.onclick = async () => {
              if (!armed) { armed = true; del.textContent = "Sure?"; del.className = "btn danger sm"; return; }
              await onDelete();
            };
            row.appendChild(del);
          }
          return row;
        }

        function qcAddRow(ph, label, onSubmit) {
          const row = el("div", "kv-row");
          const inp = textInput("", { placeholder: ph });
          inp.style.flex = "1";
          const btn = el("button", "btn primary sm", label);
          btn.type = "button";
          btn.onclick = async () => {
            const v = inp.value.trim();
            if (!v) return;
            await onSubmit(v, () => { inp.value = ""; });
          };
          row.append(inp, btn);
          return { row, input: inp };
        }

        // ── Read-only projection of the LIVE runtime tool schema ──
        // Rendered from GET /admin/registry/tool-schemas (ToolRuntime.schemas()).
        // One parameter truth: this is the same JSON Schema the model sees.
        function regSchemaTable(container, schema) {
          const props = (schema.parameters || {}).properties || {};
          const required = new Set((schema.parameters || {}).required || []);
          const names = Object.keys(props);
          if (!names.length) {
            container.appendChild(el("div", "hint", "This tool takes no parameters."));
            return;
          }
          const { wrap, tbody } = table(["Parameter", "Type", "Required", "Description", "Default", "Enum"]);
          for (const name of names) {
            const p = props[name] || {};
            const tr = el("tr");
            tr.appendChild(td(el("strong", "", name)));
            tr.appendChild(td(p.type || "—"));
            tr.appendChild(td(badge(required.has(name) ? "yes" : "no", required.has(name) ? "accent" : "")));
            const dcell = el("div", "hint", p.description || "—");
            dcell.style.cssText = "white-space:normal";
            tr.appendChild(td(dcell));
            tr.appendChild(td(p.default === undefined ? "—" : JSON.stringify(p.default)));
            tr.appendChild(td(p.enum ? p.enum.join(" | ") : "—"));
            tbody.appendChild(tr);
          }
          container.appendChild(wrap);
        }

        // ── Queries (registered): the Exact + Recall corpus, ONE row per write ──
        // Every op goes straight to the query plane: add / text-edit re-embed

        // The UI never batch-saves a corpus: there is nothing to Publish.
        async function renderRegQueries(container, cap) {
          let cur;
          try {
            cur = await apiFetch("/admin/registry/capabilities/" + encodeURIComponent(cap.capability_id) + "/queries");
          } catch (e) { container.appendChild(errBox(e)); return; }

          const stdCard = el("div", "legacy-card");
          stdCard.appendChild(el("div", "section-title", "Standard Queries — the canonical sentence per language"));
          stdCard.appendChild(el("div", "hint", "The Matcher exact set is the ENABLED Standard + Similar rows. A routable capability needs one enabled Standard in zh AND one in en; language is derived (Han char → zh), never entered."));
          for (const r of cur.standard) {
            const row = el("div", "kv-row"); row.style.cssText = rowStyle;
            qcRow(row, {
              lang: r.language, text: r.query, embedded: r.has_embedding, enabled: r.enabled,
              onEditText: (v, done) => qcWrite("/admin/registry/queries/standard/" + r.id,

              onToggle: (on) => qcWrite("/admin/registry/queries/standard/" + r.id + "/enabled",
                { method: "POST", body: JSON.stringify({ enabled: on }) },
                (on ? "Enabled" : "Disabled") + " (live)", refresh),
              onDelete: () => qcWrite("/admin/registry/queries/standard/" + r.id + "?cascade_similar=true",
                { method: "DELETE" }, "Standard deleted with its Similars (live)", refresh),
            });
            stdCard.appendChild(row);
          }
          const addStd = qcAddRow("new standard sentence (zh or en)", "Add Standard", (v, done) =>
            qcWrite("/admin/registry/capabilities/" + encodeURIComponent(cap.capability_id) + "/queries/standard",
              { method: "POST", body: JSON.stringify({ query: v }) },
              "Added + embedded (live)", () => { done(); refresh(); }));
          stdCard.appendChild(addStd.row);
          container.appendChild(stdCard);

          const byId = {};
          for (const r of cur.standard) byId[r.id] = r.query;
          const simCard = el("div", "legacy-card");
          simCard.appendChild(el("div", "section-title", "Similar Queries — Recall corpus, attached to a Standard"));
          simCard.appendChild(el("div", "hint", "Each Similar rides on one Standard and must share its language. Recall keeps EVERY vector hit ≥ the threshold with provenance (query_kind=standard/similar) — no per-capability merge."));
          for (const r of cur.similar) {
            const row = el("div", "kv-row"); row.style.cssText = rowStyle;
            qcRow(row, {
              lang: r.language, text: r.query, embedded: r.has_embedding, enabled: r.enabled,
              parent: (byId[r.standard_query_id] || r.standard_query_id).slice(0, 40),
              onEditText: (v, done) => qcWrite("/admin/registry/queries/similar/" + r.id,
                { method: "PATCH", body: JSON.stringify({ query: v }) },
                "Saved + re-embedded (live)", done),
              onToggle: (on) => qcWrite("/admin/registry/queries/similar/" + r.id + "/enabled",
                { method: "POST", body: JSON.stringify({ enabled: on }) },
                (on ? "Enabled" : "Disabled") + " (live)", refresh),
              onDelete: () => qcWrite("/admin/registry/queries/similar/" + r.id,
                { method: "DELETE" }, "Row deleted (live)", refresh),
            });
            simCard.appendChild(row);
          }
          const simAdd = qcAddRow("new similar sentence", "Add Similar", (v, done) => {
            if (!parentSel.value) { toast("Create a Standard query first — every Similar attaches to one", "error"); return; }
            qcWrite("/admin/registry/capabilities/" + encodeURIComponent(cap.capability_id) + "/queries/similar",
              { method: "POST", body: JSON.stringify({ standard_query_id: parentSel.value, query: v }) },
              "Added + embedded (live)", () => { done(); refresh(); });
          });
          const parentSel = select(cur.standard.map((r) => ({ label: "[" + r.language + "] " + r.query.slice(0, 50), value: r.id })), (cur.standard[0] || {}).id || "");
          simAdd.row.prepend(parentSel);
          if (!cur.standard.length) simAdd.row.appendChild(el("span", "badge warn", "needs a Standard first"));
          simCard.appendChild(simAdd.row);
          container.appendChild(simCard);
        }

        // ── History: live-set checks, query dry-run, snapshots, rollback, audit ──
        async function renderRegHistory(container) {
          // Validation gate against the LIVE set (zero writes)
          const valCard = el("div", "legacy-card");
          valCard.appendChild(el("div", "section-title", "Validate live set"));
          valCard.appendChild(el("div", "hint", "Runs the same gate every write goes through (cross-checked against the live ToolRuntime roster) — see the current verdict without writing anything."));
          const valBtn = el("button", "btn ghost", "Run validation");
          valBtn.type = "button";
          const valOut = el("div");
          valCard.append(valBtn, valOut);
          container.appendChild(valCard);
          valBtn.onclick = async () => {
            valOut.innerHTML = "";
            try {
              const d = await apiFetch("/admin/registry/validate");
              valOut.appendChild(el("div", "hint", "capabilities=" + d.capabilities));
              const issues = d.issues || [];
              if (!issues.length) valOut.appendChild(badge("no issues", "ok"));
              else for (const s of issues) valOut.appendChild(el("div", "trace-out err", s));
            } catch (e) { valOut.appendChild(errBox(e)); }
          };

          // Corpus health: embeddings + what the runtime actually sees
          const embCard = el("div", "legacy-card");
          embCard.appendChild(el("div", "section-title", "Corpus health (embeddings + runtime view)"));
          const embOut = el("div");
          embCard.appendChild(embOut);
          container.appendChild(embCard);
          try {
            const [st, lv] = await Promise.all([
              apiFetch("/admin/registry/embedding-status"),
              apiFetch("/admin/registry/live-view"),
            ]);
            embOut.appendChild(el("div", "hint", "standard: " + st.standard.embedded + "/" + st.standard.total
              + " · similar: " + st.similar.embedded + "/" + st.similar.total
              + " · pending: " + (st.pending || 0)
              + (st.pending ? " — run scripts/embed_corpus.py to backfill" : "")));
            if (st.embedding_profile) {
              embOut.appendChild(el("div", "hint", "embedding profile: " + st.embedding_profile.model
                + " · dim " + st.embedding_profile.dim + " · " + st.embedding_profile.provider));
            }
            embOut.appendChild(el("div", "hint", "runtime live view: "
              + (lv.fingerprint ? maskHash(lv.fingerprint) : "— (no capabilities)")
              + " · routable: " + (lv.capabilities || []).filter((c) => c.routable).length
              + "/" + (lv.capabilities || []).length));
          } catch (e) { embOut.appendChild(errBox(e)); }

          // Full-chain query dry-run against the LIVE tables
          const routeCard = el("div", "legacy-card");
          routeCard.appendChild(el("div", "section-title", "Query dry-run (live tables)"));
          routeCard.appendChild(el("div", "hint", "Matcher → Recall → ToolIntentModel → Binder → Final Route over the live corpus, side-effect free; model/embedding usage is billed as preview."));
          const q = el("textarea"); q.rows = 2; q.placeholder = "e.g. 创建一个叫 notes 的文件夹";
          const runBtn = el("button", "btn ghost", "Run");
          runBtn.type = "button";
          const routeOut = el("div");
          routeCard.append(field("Query", q), runBtn, routeOut);
          container.appendChild(routeCard);
          runBtn.onclick = async () => {
            const query = q.value.trim();
            if (!query) { toast("Enter a query first", "error"); return; }
            runBtn.disabled = true;
            routeOut.innerHTML = "";
            try {
              const d = await apiFetch("/admin/registry/preview-route", { method: "POST", body: JSON.stringify({ query }) });
              const sum = el("div", "hint");
              sum.textContent = "deepest_stage=" + d.deepest_stage + " · matcher=" + d.matcher
                + " · recall=" + d.recall_count + (d.recall_top !== "-" ? " (top " + d.recall_top + ")" : "")
                + " · tool_intent=" + d.tool_intent
                + (d.binder_state ? " · binder=" + d.binder_state : "")
                + " · final_route=" + d.final_route
                + (d.fallback_reason && d.fallback_reason !== "-" ? " · fallback=" + d.fallback_reason : "")
                + " · " + d.total_ms + " ms · live fingerprint=" + (d.registry_version || "—");
              routeOut.appendChild(sum);
              const cands = d.candidates || [];
              if (cands.length) {
                const { wrap, tbody } = table(["capability", "origin", "kind", "matched sentence", "score"]);
                for (const c of cands) {
                  const tr = el("tr");
                  tr.appendChild(td(c.capability_id));
                  tr.appendChild(td(c.origin));
                  tr.appendChild(td(c.kind || c.query_kind || "—"));
                  tr.appendChild(td(c.matched_example || "—"));
                  tr.appendChild(td(c.origin === "recall" ? Number(c.score).toFixed(3) : "table"));
                  tbody.appendChild(tr);
                }
                routeOut.appendChild(wrap);
              } else {
                routeOut.appendChild(el("div", "hint", "Empty candidate set — Action Detection still ran; the model could only answer NONE."));
              }
              if (d.model_verdict) {
                routeOut.appendChild(el("pre", "trace-out", JSON.stringify(d.model_verdict, null, 2)));
              }
              if (d.route) routeOut.appendChild(el("pre", "trace-out ok", JSON.stringify(d.route, null, 2)));
            } catch (e) { routeOut.appendChild(errBox(e)); }
            runBtn.disabled = false;
          };

          // Version snapshots (history only) + rollback = restore + re-embed
          const verCard = el("div", "legacy-card");
          verCard.appendChild(el("div", "section-title", "Version snapshots (history)"));
          verCard.appendChild(el("div", "hint", "Every accepted mutation first stores the PRE-change content here — history only, nothing is activated from it. Rollback replays a snapshot into the live tables and re-embeds; an embedder failure reports the partial restore honestly (503)."));
          const verOut = el("div");
          verCard.appendChild(verOut);
          container.appendChild(verCard);
          try {
            const d = await apiFetch("/admin/registry/versions");
            const { wrap, tbody } = table(["version", "fingerprint", "source", "actor", "caps", "note", "when", ""]);
            for (const v of (d.versions || [])) {
              const tr = el("tr");
              tr.appendChild(td("v" + v.version));
              tr.appendChild(td(maskHash(v.fingerprint)));
              tr.appendChild(td(v.source_version != null ? "v" + v.source_version : "—"));
              tr.appendChild(td(v.actor_username || "—"));
              tr.appendChild(td(String(v.capabilities)));
              tr.appendChild(td(v.note || (v.error ? "✗ " + v.error : "—")));
              tr.appendChild(td((v.created_at || "").replace("T", " ").slice(0, 19)));
              const cell = el("td");
              let armed = false;
              const rb = el("button", "btn sm ghost", "Rollback");
              rb.type = "button";
              rb.onclick = async () => {
                if (!armed) { armed = true; rb.textContent = "Confirm?"; rb.className = "btn sm danger"; return; }
                rb.disabled = true;
                try {
                  const r = await apiFetch("/admin/registry/versions/" + v.version + "/rollback", { method: "POST", body: JSON.stringify({}) });
                  toast("Restored v" + r.restored_version + " (" + r.capabilities + " caps)"
                    + ((r.issues || []).length ? " — " + r.issues.length + " validation issues remain" : ""), "ok");
                  await renderRegistryPage();
                } catch (e) { toast("Rollback failed: " + e.message, "error"); rb.disabled = false; }
              };
              cell.appendChild(rb);
              tr.appendChild(cell);
              tbody.appendChild(tr);
            }
            verOut.appendChild(wrap);
          } catch (e) { verOut.appendChild(errBox(e)); }

          // Audit trail
          const audCard = el("div", "legacy-card");
          audCard.appendChild(el("div", "section-title", "Audit trail"));
          const audOut = el("div");
          audCard.appendChild(audOut);
          container.appendChild(audCard);
          try {
            const d = await apiFetch("/admin/registry/audit?limit=50");
            const { wrap, tbody } = table(["when", "action", "actor", "target", "ok", "detail"]);
            for (const a of (d.entries || [])) {
              const tr = el("tr");
              tr.appendChild(td((a.created_at || "").replace("T", " ").slice(0, 19)));
              tr.appendChild(td(a.action));
              tr.appendChild(td(a.actor_username || "—"));
              tr.appendChild(td(a.target || "—"));
              tr.appendChild(td(badge(a.ok ? "ok" : "fail", a.ok ? "ok" : "danger")));
              tr.appendChild(td(a.detail && Object.keys(a.detail).length ? JSON.stringify(a.detail) : "—"));
              tbody.appendChild(tr);
            }
            audOut.appendChild(wrap);
          } catch (e) { audOut.appendChild(errBox(e)); }
        }

        // ───────────────────────── Observability console (Phase 6) ─────────────────────────
        let obsTab = "logs";

        async function renderObservabilityPage() {
          content.innerHTML = "";
          const head = el("div", "page-head");
          const t = el("div");
          t.appendChild(el("h2", "", "Observability"));
          t.appendChild(el("div", "sub", "Log tail, funnel decision events (8.12), and latency probes — read-only, no new pipeline."));
          head.appendChild(t);
          content.appendChild(head);

          const tabs = el("div", "tabs");
          for (const [key, label] of [["logs", "Logs"], ["events", "Funnel Events"], ["perf", "Performance"]]) {
            const tab = el("div", "tab" + (obsTab === key ? " active" : ""), label);
            tab.onclick = () => { obsTab = key; renderObservabilityPage(); };
            tabs.appendChild(tab);
          }
          content.appendChild(tabs);
          const section = el("div");
          content.appendChild(section);
          if (obsTab === "logs") await renderObsLogs(section);
          else if (obsTab === "events") await renderObsEvents(section);
          else await renderObsPerf(section);
        }

        async function renderObsLogs(container) {
          const card = el("div", "legacy-card");
          card.appendChild(el("div", "section-title", "Process log tail"));
          const file = select([{ label: "api.log", value: "api" }, { label: "worker.log", value: "worker" }], "api");
          const level = select([{ label: "all", value: "all" }, { label: "warning+", value: "warning" }, { label: "error+", value: "error" }], "all");
          const limit = numInput(200);
          const btn = el("button", "btn ghost", "Load");
          btn.type = "button";
          const out = el("div");
          card.append(field("File", file), field("Level", level), field("Lines", limit), btn, out);
          container.appendChild(card);
          const load = async () => {
            out.innerHTML = "";
            try {
              const d = await apiFetch("/admin/observability/logs?file=" + file.value + "&level=" + level.value + "&limit=" + (parseInt(limit.value, 10) || 200));
              out.appendChild(el("div", "hint", (d.file || "") + (d.missing ? " — file not found yet" : "") + (d.truncated ? " · truncated" : "")));
              const pre = el("pre", "trace-out");
              pre.style.maxHeight = "60vh";
              pre.style.overflow = "auto";
              pre.textContent = (d.lines || []).join("\n") || "(no matching lines)";
              out.appendChild(pre);
            } catch (e) { out.appendChild(errBox(e)); }
          };
          btn.onclick = load;
          await load();
        }

        async function renderObsEvents(container) {
          const card = el("div", "legacy-card");
          card.appendChild(el("div", "section-title", "Funnel decision events"));
          const mode = select([{ label: "any", value: "" }, { label: "production", value: "production" }, { label: "preview", value: "preview" }, { label: "shadow", value: "shadow" }, { label: "test", value: "test" }], "");
          const route = select([{ label: "any", value: "" }, { label: "action", value: "action" }, { label: "agent", value: "agent" }], "");
          const limit = numInput(50);
          const btn = el("button", "btn ghost", "Load");
          btn.type = "button";
          const out = el("div");
          card.append(field("Mode", mode), field("Final route", route), field("Limit", limit), btn, out);
          container.appendChild(card);
          const load = async () => {
            out.innerHTML = "";
            try {
              const qs = new URLSearchParams({ limit: String(parseInt(limit.value, 10) || 50) });
              if (mode.value) qs.set("mode", mode.value);
              if (route.value) qs.set("route", route.value);
              const d = await apiFetch("/admin/observability/funnel-events?" + qs.toString());
              const events = d.events || [];
              if (!events.length) { out.appendChild(emptyState("No events in this window.")); return; }
              for (const ev of events) {
                const row = el("div", "node-trace");
                const h = el("div", "trace-head");
                h.appendChild(el("span", "cell-main code", (ev.created_at || "").replace("T", " ").slice(0, 19)));
                h.appendChild(badge(ev.final_route, ev.final_route === "action" ? "ok" : ""));
                if (ev.execution_mode !== "production") h.appendChild(badge(ev.execution_mode, "accent"));
                if (ev.fallback_reason && ev.fallback_reason !== "-") h.appendChild(badge(ev.fallback_reason, "danger"));
                h.appendChild(el("span", "trace-ms", (ev.total_ms != null ? ev.total_ms + " ms" : "")));
                row.appendChild(h);
                const meta = el("div", "hint");
                meta.textContent = "stage=" + ev.deepest_stage + " · matcher=" + (ev.matcher || "-")
                  + " · recall=" + ev.recall_count + " (" + (ev.recall_top || "-") + ")"
                  + " · tool_intent=" + (ev.tool_intent || "-")
                  + (ev.capability_id ? " · cap=" + ev.capability_id : "")
                  + " · registry=" + (ev.registry_version || "—") + " index=" + (ev.index_version || "—");
                row.appendChild(meta);
                if (ev.trace_json) row.appendChild(el("pre", "trace-out", JSON.stringify(ev.trace_json, null, 2)));
                out.appendChild(row);
              }
            } catch (e) { out.appendChild(errBox(e)); }
          };
          btn.onclick = load;
          await load();
        }

        async function renderObsPerf(container) {
          const card = el("div", "legacy-card");
          card.appendChild(el("div", "section-title", "Latency & system probes"));
          const hours = numInput(24);
          const btn = el("button", "btn ghost", "Refresh");
          btn.type = "button";
          const out = el("div");
          card.append(field("Window (hours)", hours), btn, out);
          container.appendChild(card);
          const load = async () => {
            out.innerHTML = "";
            try {
              const d = await apiFetch("/admin/observability/latency?hours=" + (parseInt(hours.value, 10) || 24));
              if (d.funnel_ms && d.funnel_ms.length) {
                const { wrap, tbody } = table(["final route", "count", "p50 ms", "p95 ms", "p99 ms"]);
                for (const f of d.funnel_ms) {
                  const tr = el("tr");
                  tr.appendChild(td(f.final_route));
                  tr.appendChild(td(String(f.count)));
                  tr.appendChild(td(String(f.p50)));
                  tr.appendChild(td(String(f.p95)));
                  tr.appendChild(td(String(f.p99)));
                  tbody.appendChild(tr);
                }
                out.appendChild(wrap);
              } else {
                out.appendChild(el("div", "hint", "No funnel events in the window" + (d.db_error ? " — " + d.db_error : "") + "."));
              }
              const probes = [];
              probes.push("db ping: " + (d.db_ping_ms != null ? d.db_ping_ms + " ms" : "—"));
              const eh = d.embed_health;
              probes.push("embedding /health: " + (eh ? (eh.ok ? "ok " + eh.ms + " ms" : "DOWN") : "—"));
              if (d.system) probes.push("cpu " + d.system.cpu_percent + "% · mem " + d.system.mem_percent + "% · rss " + d.system.rss_mb + " MB");
              out.appendChild(el("div", "hint", probes.join("  ·  ")));
              if (d.llm_activity && d.llm_activity.length) {
                out.appendChild(el("div", "section-sub", "LLM activity (tokens/cost — per-call latency is not recorded)"));
                const { wrap, tbody } = table(["model", "calls", "tokens", "cost usd"]);
                for (const m of d.llm_activity) {
                  const tr = el("tr");
                  tr.appendChild(td(m.model));
                  tr.appendChild(td(String(m.calls)));
                  tr.appendChild(td(String(m.tokens)));
                  tr.appendChild(td(m.cost_usd.toFixed(4)));
                  tbody.appendChild(tr);
                }
                out.appendChild(wrap);
              }
            } catch (e) { out.appendChild(errBox(e)); }
          };
          btn.onclick = load;
          await load();
        }

        boot();
      })();
    </script>
  </body>
</html>
