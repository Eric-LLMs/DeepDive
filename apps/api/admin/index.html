<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delveta Admin</title>
    <style>
      :root {
        --bg: #0f1115;
        --bg2: #13161c;
        --panel: #181b21;
        --panel2: #1d2128;
        --border: #2a2f3a;
        --text: #e6e8ee;
        --muted: #8a90a0;
        --accent: #4f7cff;
        --accent-dim: rgba(79, 124, 255, 0.14);
        --accent-text: #fff;
        --danger: #e05252;
        --danger-dim: rgba(224, 82, 82, 0.14);
        --ok: #34c07a;
        --ok-dim: rgba(52, 192, 122, 0.14);
        --warn: #e0a23c;
        --gold: #d9b450;
        --mono: "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      .hidden { display: none !important; }
      .muted { color: var(--muted); }

      /* ── login ── */
      .login-card {
        max-width: 360px; margin: 80px auto; background: var(--panel);
        border: 1px solid var(--border); border-radius: 12px; padding: 28px;
      }
      .login-card h1 { font-size: 18px; margin-bottom: 20px; }
      .login-card label { display: block; margin-bottom: 14px; }
      .login-card label span { display: block; margin-bottom: 6px; color: var(--muted); }
      .login-card input {
        width: 100%; background: var(--bg); border: 1px solid var(--border);
        color: var(--text); padding: 9px 12px; border-radius: 6px;
      }
      .login-card input:focus { outline: none; border-color: var(--accent); }
      .login-card button {
        width: 100%; margin-top: 6px; background: var(--accent); color: var(--accent-text);
        border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600;
      }
      .login-card .err { color: var(--danger); margin-top: 12px; font-size: 13px; }

      /* ── app shell ── */
      .app { display: flex; flex-direction: column; height: 100vh; }
      .topbar {
        height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between;
        padding: 0 18px; border-bottom: 1px solid var(--border); background: var(--bg2);
      }
      .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
      .logo {
        width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;
      }
      .topbar .right { display: flex; align-items: center; gap: 14px; }
      .admin-chip { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .admin-chip .avatar {
        width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
      }
      .body { flex: 1; display: flex; min-height: 0; }
      .sidenav {
        width: 196px; flex: none; border-right: 1px solid var(--border); background: var(--bg2);
        padding: 12px 8px; display: flex; flex-direction: column; gap: 2px;
      }
      .nav-item {
        padding: 9px 12px; border-radius: 6px; cursor: pointer; color: var(--muted);
        font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 10px;
        transition: background 0.12s ease, color 0.12s ease;
      }
      .nav-item:hover { background: var(--panel); color: var(--text); }
      .nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
      .content { flex: 1; overflow-y: auto; padding: 22px 26px 80px; }

      /* ── page header / bars ── */
      .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
      .page-head h2 { margin: 0; font-size: 18px; }
      .page-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
      .bar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .bar-title { font-size: 13.5px; font-weight: 600; }
      .bar-title .count { color: var(--muted); font-weight: 500; }

      /* ── buttons ── */
      .btn {
        background: transparent; border: 1px solid var(--border); color: var(--text);
        padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn.primary:disabled { opacity: 0.6; cursor: default; }
      .btn.danger { border-color: var(--danger); color: var(--danger); }
      .btn.danger:hover { background: var(--danger-dim); }
      .btn.ghost { color: var(--muted); }
      .btn.sm { padding: 4px 9px; font-size: 12px; }
      .icon-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 5px; }
      .icon-btn:hover { color: var(--text); background: var(--panel); }
      .icon-btn .icon-label { font-size: 12px; margin-left: 2px; vertical-align: middle; }
      .row-actions { display: flex; gap: 6px; align-items: center; }

      /* ── tabs (raised 3D buttons) ── */
      .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
      .tab {
        padding: 8px 16px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
        border-radius: 6px; user-select: none; text-align: center;
        background: linear-gradient(180deg, var(--panel2), var(--panel));
        border: 1px solid var(--border);
        transition: filter 0.12s ease;
      }
      .tab:hover { color: var(--text); filter: brightness(1.1); }
      .tab.active {
        color: #fff; font-weight: 600;
        background: linear-gradient(180deg, #5a86ff, #4f7cff);
        border-color: #3a5fd0;
      }

      /* ── tables ── */
      .tbl-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
      table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
      .tbl th {
        text-align: left; padding: 10px 14px; color: var(--muted); font-weight: 600;
        font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;
        border-bottom: 1px solid var(--border); background: var(--bg2); white-space: nowrap;
      }
      .tbl td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      .tbl tr:last-child td { border-bottom: none; }
      .tbl tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
      .cell-main { font-weight: 600; }
      .cell-sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
      .code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
      .link { color: var(--accent); cursor: pointer; }
      .link:hover { text-decoration: underline; }

      /* ── badges ── */
      .badge {
        display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 9px;
        border-radius: 10px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
      }
      .badge.accent { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
      .badge.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-dim); }
      .badge.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-dim); }
      .badge.gold { color: var(--gold); border-color: var(--gold); background: rgba(217, 180, 80, 0.12); }
      .badge.warn { color: var(--warn); border-color: var(--warn); background: rgba(224, 162, 60, 0.12); }
      .mini-chip {
        display: inline-block; font-size: 11px; color: var(--muted); background: var(--bg);
        border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; margin: 1px 2px 1px 0;
      }
      .mini-chip b { color: var(--text); font-weight: 600; }

      /* ── switch ── */
      .switch {
        position: relative; width: 34px; height: 20px; background: var(--border);
        border-radius: 10px; cursor: pointer; border: none; flex: none; padding: 0;
      }
      .switch::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
        border-radius: 50%; background: #cfd3dc; transition: transform 0.15s, background 0.15s;
      }
      .switch.on { background: var(--ok); }
      .switch.on::after { transform: translateX(14px); background: #fff; }

      /* ── key / token chips ── */
      .key-chip {
        font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--bg);
        border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px;
        display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      }
      .key-chip button { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0; }
      .key-chip button:hover { color: var(--accent); }

      /* ── forms ── */
      .field { display: block; margin-bottom: 14px; }
      .field > span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
      .field input, .field select, .field textarea {
        width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
        padding: 8px 10px; border-radius: 6px; font-size: 13px; font-family: inherit;
      }
      .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
      .field textarea { min-height: 84px; resize: vertical; font-family: var(--mono); font-size: 12px; }
      .field input[type="password"] { font-family: var(--mono); }
      .field .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
      .field-row { display: flex; gap: 12px; }
      .field-row .field { flex: 1; }
      .switch-row { display: flex; align-items: center; gap: 10px; }
      .cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .cfg-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
      .cfg-toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
      .section-sub { font-weight: 600; font-size: 13px; margin: 16px 0 6px; color: var(--muted); }
      .kv-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
      .kv-row input { flex: 1; }
      .kv-row .btn { flex: 0 0 auto; padding: 4px 10px; }
      /* secret field with reveal / copy actions (Tools config) */
      .secret-row { display: flex; gap: 6px; align-items: center; }
      .secret-row input { flex: 1; min-width: 0; }
      .secret-row .btn { flex: 0 0 auto; padding: 6px 10px; font-size: 12px; }
      .secret-row .btn:disabled { opacity: 0.45; cursor: default; }

      /* ── chat-test user autocomplete ── */
      .user-ac { position: relative; }
      .user-ac-list {
        position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 30;
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        max-height: 260px; overflow: auto; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .user-ac-item { padding: 8px 12px; font-size: 13px; cursor: pointer; color: var(--text); }
      .user-ac-item:hover, .user-ac-item.active { background: var(--bg2); color: var(--accent); }
      .user-ac-empty { padding: 8px 12px; font-size: 12px; color: var(--muted); }

      /* ── chips (multi-select) ── */
      .chip-group { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
      .chip-toggle { position: relative; cursor: pointer; }
      .chip-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
      .chip {
        display: inline-block; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border);
        color: var(--muted); font-size: 12px;
      }
      .chip-toggle input:checked + .chip, .chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

      /* ── drawer / modal ── */
      .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 50; display: flex; }
      .overlay.center { align-items: center; justify-content: center; }
      .drawer { margin-left: auto; width: 480px; max-width: 94vw; background: var(--panel); border-left: 1px solid var(--border); height: 100%; display: flex; flex-direction: column; animation: slideIn 0.16s ease-out; }
      .drawer.wide { width: 720px; max-width: 96vw; }
      @keyframes slideIn { from { transform: translateX(30px); opacity: 0.4; } to { transform: translateX(0); opacity: 1; } }
      .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border); }
      .drawer-head h3 { margin: 0; font-size: 15px; }
      .drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
      .drawer-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
      .modal-card { width: 540px; max-width: 94vw; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
      .modal-title { margin: 0 0 8px; font-size: 16px; }
      .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
      .confirm-text { color: var(--text); font-size: 13.5px; line-height: 1.5; margin: 0; }

      /* ── reveal box ── */
      .reveal-box {
        margin-top: 12px; background: var(--bg); border: 1px dashed var(--accent); border-radius: 8px;
        padding: 10px 12px; font-family: var(--mono); font-size: 12px; word-break: break-all;
        display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--accent);
      }

      /* ── toast ── */
      .toast-wrap { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
      .toast {
        padding: 10px 16px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border);
        font-size: 13px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); max-width: 400px; animation: fadeUp 0.15s ease-out;
      }
      @keyframes fadeUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .toast.ok { border-color: var(--ok); }
      .toast.err { border-color: var(--danger); }

      /* ── misc ── */
      .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 13px; }
      .loading { color: var(--muted); text-align: center; padding: 28px; font-size: 13px; }
      .err-box { background: var(--danger-dim); border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
      .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
      .filter-bar input, .filter-bar select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; }
      .filter-bar input:focus, .filter-bar select:focus { outline: none; border-color: var(--accent); }
      .test-res { font-size: 12px; margin-top: -8px; margin-bottom: 12px; }
      .test-res.ok { color: var(--ok); }
      .test-res.err { color: var(--danger); }
      .chat-test-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
      .chat-test-msg { max-width: 78%; padding: 10px 14px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
      .chat-test-msg.user { background: var(--accent); color: #fff; margin-left: auto; align-self: flex-end; }
      .chat-test-msg.ai { background: var(--bg2); border: 1px solid var(--border); align-self: flex-start; }
      .chat-test-msg.err { background: var(--danger-dim); border: 1px solid var(--danger); color: var(--danger); align-self: flex-start; }
      .route-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
      .route-summary .kv { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
      .route-summary .kv .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      .route-summary .kv .v { font-size: 13px; margin-top: 3px; word-break: break-all; }
      .legacy-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-top: 20px; }
      .section-title { font-size: 14px; font-weight: 600; margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
      .section-title:first-child { margin-top: 0; }
      .kbd-note { font-size: 12px; color: var(--muted); }

      /* ── Query Corpus manager (Queries tab, read-only-first) ── */
      .qc-head { margin-bottom: 14px; }
      .qc-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .qc-caption { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
      .qc-help {
        display: inline-flex; align-items: center; justify-content: center;
        width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--border);
        color: var(--muted); font-size: 10px; cursor: help; vertical-align: 1px;
      }
      .qc-standard {
        background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
        border-radius: 8px; padding: 14px 16px; margin-bottom: 16px;
        display: flex; align-items: flex-start; gap: 12px;
      }
      .qc-standard .qc-std-body { flex: 1; min-width: 0; }
      .qc-standard .qc-label {
        font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
        color: var(--muted); margin-bottom: 5px; display: flex; align-items: center; gap: 7px;
      }
      .qc-standard .qc-text { font-size: 15.5px; font-weight: 600; line-height: 1.45; word-wrap: break-word; overflow-wrap: break-word; }
      .qc-section-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        margin: 0 0 4px; padding: 10px 2px 8px; border-bottom: 1px solid var(--border);
      }
      .qc-section-bar .qc-count { font-size: 13px; font-weight: 600; }
      .qc-section-bar .qc-count .n { color: var(--muted); font-weight: 500; }
      .qc-list-caption { font-size: 11.5px; color: var(--muted); padding: 6px 2px 2px; }
      .qc-row {
        display: flex; align-items: flex-start; gap: 10px; padding: 8px 8px; border-radius: 6px;
        border-bottom: 1px solid var(--border); transition: background .12s ease;
      }
      .qc-row:last-child { border-bottom: none; }
      .qc-row:hover { background: var(--bg2); }
      .qc-row .qc-num { font-family: var(--mono); font-size: 11.5px; color: var(--muted); flex: none; padding-top: 3px; width: 22px; text-align: right; }
      .qc-lang {
        flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted);
        border: 1px solid var(--border); border-radius: 4px; padding: 1.5px 4px; margin-top: 2.5px;
      }
      .qc-text-cell { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.5; word-wrap: break-word; overflow-wrap: break-word; }
      .qc-edit-btn { opacity: .35; transition: opacity .12s ease; flex: none; }
      .qc-row:hover .qc-edit-btn, .qc-standard:hover .qc-edit-btn { opacity: 1; }
      .qc-editing { background: var(--accent-dim); border-radius: 6px; }
      .qc-edit-area { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
      .qc-edit-area textarea {
        width: 100%; background: var(--bg); border: 1px solid var(--accent); color: var(--text);
        border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 13.5px; line-height: 1.5;
        resize: vertical; min-height: 60px;
      }
      .qc-edit-area textarea:focus { outline: none; }
      .qc-edit-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
      .qc-new-badge { font-size: 10.5px; color: var(--accent); font-weight: 600; margin-right: auto; align-self: center; }

      /* ── RAG node trace ── */
      .node-trace { border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; overflow: hidden; }
      .node-trace .trace-head {
        display: flex; align-items: center; gap: 10px; padding: 8px 12px;
        background: var(--bg2); border-bottom: 1px solid var(--border);
      }
      .trace-ms { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); }
      .node-desc {
        font-size: 12px; color: var(--muted); background: var(--panel);
        border-top: 1px solid var(--border); padding: 7px 12px; line-height: 1.45;
      }
      .trace-out {
        margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px;
        color: var(--muted); white-space: pre-wrap; word-break: break-word; line-height: 1.5;
      }
      .trace-out.err { color: var(--danger); }
      .hit-text { max-width: 520px; vertical-align: top; }
      .hit-text .trace-out { max-height: 240px; overflow-y: auto; }
      .trace-params {
        display: block; width: 100%; box-sizing: border-box; resize: vertical;
        background: var(--panel); border: none; border-top: 1px solid var(--border);
        color: var(--muted); padding: 8px 12px; font-family: var(--mono); font-size: 11.5px;
        min-height: 96px;
      }
      .trace-params:focus { outline: none; color: var(--text); }
      .field-hint {
        font-size: 11.5px; color: var(--muted); background: var(--panel);
        border-top: 1px solid var(--border); padding: 6px 12px;
        border-radius: 0 0 8px 8px; line-height: 1.5;
      }
      .scroll-x { overflow-x: auto; }

      /* ── channel picker / relation cards ── */
      .channel-picker { max-height: 420px; overflow-y: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; }
      .chan-row {
        display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer;
        border-bottom: 1px solid var(--border); background: var(--panel);
      }
      .chan-row:last-child { border-bottom: none; }
      .chan-row:hover { background: var(--bg2); }
      .chan-row input[type="checkbox"] { flex: none; }
      .chan-info { flex: 1; min-width: 0; }
      .chan-price { flex: none; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
      .chan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin-bottom: 18px; }
      .chan-card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer;
      }
      .chan-card:hover { border-color: var(--accent); }
      .chan-card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .rel-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
      .rel-card h4 { margin: 0 0 10px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
      .detail-row { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
      .detail-row:last-child { border-bottom: none; }
      .detail-row .k { flex: none; width: 120px; color: var(--muted); }
      .detail-row .v { flex: 1; min-width: 0; word-break: break-word; }

      /* ── theme: light ── */
      [data-theme="light"] {
        --bg: #f4f5f7;
        --bg2: #eceef1;
        --panel: #ffffff;
        --panel2: #f2f4f7;
        --border: #d8dce2;
        --text: #1f2329;
        --muted: #5f6773;
        --accent: #3b6fe0;
        --accent-dim: rgba(59, 111, 224, 0.10);
        --accent-text: #ffffff;
        --danger: #d64545;
        --danger-dim: rgba(214, 69, 69, 0.10);
        --ok: #1f9d55;
        --ok-dim: rgba(31, 157, 85, 0.12);
        --warn: #b8860b;
        --gold: #b8860b;
      }
      [data-theme="light"] .tbl tbody tr:hover td { background: rgba(0, 0, 0, 0.03); }
      [data-theme="light"] .switch::after { background: #ffffff; }
      [data-theme="light"] .overlay { background: rgba(30, 35, 45, 0.4); }
      [data-theme="light"] .toast { box-shadow: 0 6px 20px rgba(20, 25, 35, 0.12); }
      [data-theme="light"] .badge.gold { background: rgba(184, 134, 11, 0.10); }
      [data-theme="light"] .badge.warn { background: rgba(184, 134, 11, 0.10); }
      [data-theme="light"] .settings-pop { box-shadow: 0 10px 30px rgba(20, 25, 35, 0.12); }

      /* ── settings popover ── */
      .settings-wrap { position: relative; }
      .settings-backdrop { position: fixed; inset: 0; z-index: 55; }
      .settings-pop {
        position: absolute; top: 44px; right: 0; width: 236px; background: var(--panel);
        border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        padding: 8px; z-index: 60;
      }
      .settings-title {
        font-size: 11px; color: var(--muted); padding: 6px 10px 4px;
        text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
      }
      button.settings-row {
        display: flex; align-items: center; justify-content: space-between; width: 100%;
        background: transparent; border: none; color: var(--text); font-size: 13px; padding: 7px 10px;
        border-radius: 6px; cursor: pointer; text-align: left; font-family: inherit;
      }
      button.settings-row:hover { background: var(--panel2); }
      button.settings-row.on { color: var(--accent); font-weight: 600; }
      button.settings-row .check { visibility: hidden; }
      button.settings-row.on .check { visibility: visible; }
      .settings-select {
        width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
        padding: 7px 10px; border-radius: 6px; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!-- Login view -->
    <div id="login-view" class="hidden">
      <div class="login-card">
        <h1>Delveta Admin</h1>
        <label><span>Username</span><input id="login-user" type="text" autocomplete="username" /></label>
        <label><span>Password</span><input id="login-pass" type="password" autocomplete="current-password" /></label>
        <button id="login-btn" type="button">Sign in</button>
        <p id="login-err" class="err"></p>
      </div>
    </div>

    <!-- App view -->
    <div id="app-view" class="hidden">
      <div class="app">
        <div class="topbar">
          <div class="brand">
            <div class="logo">DD</div>
            <span>Delveta Admin</span>
          </div>
          <div class="right">
            <div class="settings-wrap">
              <button id="settings-btn" class="icon-btn" title="Theme & font size" type="button">⚙ <span class="icon-label">Settings</span></button>
              <div class="settings-backdrop hidden" id="settings-backdrop"></div>
              <div class="settings-pop hidden" id="settings-pop">
                <div class="settings-title">Theme</div>
                <button class="settings-row" type="button" data-theme-opt="dark"><span>Dark</span><span class="check">✓</span></button>
                <button class="settings-row" type="button" data-theme-opt="light"><span>Light</span><span class="check">✓</span></button>
                <button class="settings-row" type="button" data-theme-opt="system"><span>Follow System</span><span class="check">✓</span></button>
                <div class="settings-title">Font size</div>
                <select id="settings-font" class="settings-select">
                  <option value="12">12 px</option>
                  <option value="13">13 px</option>
                  <option value="14">14 px</option>
                  <option value="15">15 px</option>
                  <option value="16">16 px</option>
                  <option value="17">17 px</option>
                  <option value="18">18 px</option>
                </select>
              </div>
            </div>
            <button id="refresh-btn" class="icon-btn" title="Refresh page">⟳</button>
            <div class="admin-chip">
              <span class="avatar" id="admin-avatar">A</span>
              <span id="admin-name"></span>
            </div>
            <button id="logout-btn" class="btn ghost" type="button">Sign out</button>
          </div>
        </div>
        <div class="body">
          <div class="sidenav">
            <div class="nav-item" data-page="providers">Providers</div>
            <div class="nav-item" data-page="roles">Roles</div>
            <div class="nav-item" data-page="users">Users</div>
            <div class="nav-item" data-page="tokens">Tokens</div>
            <div class="nav-item" data-page="tools">Tools config</div>
            <div class="nav-item" data-page="rag">RAG</div>
            <div class="nav-item" data-page="intent-registry">Intent Registry</div>
            <div class="nav-item" data-page="observability">Observability</div>
          </div>
          <div class="content" id="content"></div>
        </div>
      </div>
    </div>

    <div class="toast-wrap" id="toasts"></div>

    <script>
      (() => {
        const TOKEN_KEY = "delveta_admin_token";
        const loginView = document.getElementById("login-view");
        const appView = document.getElementById("app-view");
        const content = document.getElementById("content");

        // ───────────────────────── shared state ─────────────────────────
        const state = {};

        // ───────────────────────── appearance (theme + font size) ─────────────────────────
        const THEME_KEY = "delveta_admin_theme";
        const FONT_KEY = "delveta_admin_fontsize";

        function readPref(key, fallback) {
          try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
        }
        function writePref(key, val) {
          try { localStorage.setItem(key, val); } catch { /* ignore */ }
        }
        function effectiveTheme(t) {
          if (t !== "system") return t;
          try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
          catch { return "dark"; }
        }
        function applyTheme(t) {
          document.documentElement.dataset.theme = effectiveTheme(t);
          document.querySelectorAll("[data-theme-opt]").forEach((b) => {
            b.classList.toggle("on", b.dataset.themeOpt === t);
          });
        }
        function applyFontSize(px) {
          document.documentElement.style.setProperty("zoom", String(px / 14));
        }

        let theme = readPref(THEME_KEY, "dark");
        let fontSize = parseInt(readPref(FONT_KEY, "14"), 10) || 14;
        try {
          applyTheme(theme);
          applyFontSize(fontSize);
          const sel = document.getElementById("settings-font");
          if (sel) sel.value = String(fontSize);
        } catch { /* ignore */ }

        // ───────────────────────── dom helpers ─────────────────────────
        const $ = (sel) => document.querySelector(sel);

        function el(tag, cls, text) {
          const node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text !== undefined && text !== null) node.textContent = text;
          return node;
        }

        function td(content) {
          const c = el("td");
          if (content == null) return c;
          if (typeof content === "string") c.textContent = content;
          else c.appendChild(content);
          return c;
        }

        function textInput(value, opts = {}) {
          const i = el("input");
          i.type = opts.type || "text";
          i.value = value ?? "";
          if (opts.placeholder) i.placeholder = opts.placeholder;
          if (opts.autocomplete) i.autocomplete = opts.autocomplete;
          return i;
        }

        function numInput(value, opts = {}) {
          const i = textInput(value == null ? "" : String(value), opts);
          i.type = "number";
          i.step = opts.step || "1";
          return i;
        }

        function select(options, value) {
          const s = el("select");
          for (const o of options) {
            const opt = el("option", "", o.label);
            opt.value = o.value;
            if (String(o.value) === String(value)) opt.selected = true;
            s.appendChild(opt);
          }
          return s;
        }

        function field(labelText, input, hint) {
          const label = el("label", "field");
          label.appendChild(el("span", "", labelText));
          label.appendChild(input);
          if (hint) label.appendChild(el("div", "hint", hint));
          return label;
        }

        function badge(text, kind) {
          return el("span", "badge" + (kind ? " " + kind : ""), text);
        }

        function switchToggle(checked, onChange) {
          const b = el("button", "switch" + (checked ? " on" : ""));
          b.type = "button";
          b.onclick = () => {
            b.classList.toggle("on");
            if (onChange) onChange(b.classList.contains("on"));
          };
          return b;
        }

        function actionBtns(actions) {
          const div = el("div", "row-actions");
          for (const a of actions) {
            const b = el("button", "btn sm" + (a.danger ? " danger" : " ghost"), a.label);
            b.type = "button";
            b.onclick = a.onClick;
            div.appendChild(b);
          }
          return div;
        }

        function table(headers) {
          const wrap = el("div", "tbl-wrap scroll-x");
          const t = el("table", "tbl");
          const thead = el("thead");
          const hr = el("tr");
          for (const h of headers) hr.appendChild(el("th", "", h));
          thead.appendChild(hr);
          t.appendChild(thead);
          const tbody = el("tbody");
          t.appendChild(tbody);
          wrap.appendChild(t);
          return { wrap, tbody };
        }

        function emptyState(text) {
          return el("div", "empty", text);
        }

        function errBox(err) {
          const box = el("div", "err-box");
          box.textContent = "Failed to load: " + (err && err.message ? err.message : err);
          return box;
        }

        function maskKey(s) {
          if (!s) return "not set";
          if (s.length <= 8) return "•".repeat(s.length);
          return s.slice(0, 4) + "••••" + s.slice(-4);
        }

        function maskHash(h) {
          if (!h) return "—";
          if (h.length <= 12) return h;
          return h.slice(0, 6) + "…" + h.slice(-4);
        }

        // ───────────────────────── api ─────────────────────────
        function token() { return localStorage.getItem(TOKEN_KEY) || ""; }

        async function apiFetch(path, opts = {}) {
          const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
          if (token()) headers.Authorization = "Bearer " + token();
          const res = await fetch(path, { ...opts, headers });
          if (res.status === 401) {
            localStorage.removeItem(TOKEN_KEY);
            showLogin();
            throw new Error("Session expired — sign in again");
          }
          let data = null;
          try { data = await res.json(); } catch { /* non-JSON body */ }
          if (!res.ok) {
            const detail = data && (data.detail || data.message);
            const msg = typeof detail === "string" ? detail : (res.statusText || "Request failed");
            throw new Error(res.status + ": " + msg);
          }
          return data;
        }

        // ───────────────────────── toast / dialogs ─────────────────────────
        function toast(msg, kind) {
          const wrap = document.getElementById("toasts");
          const t = el("div", "toast" + (kind ? " " + kind : ""), msg);
          wrap.appendChild(t);
          setTimeout(() => t.remove(), 3800);
        }

        async function copyText(text) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch {
            try {
              const ta = document.createElement("textarea");
              ta.value = text;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              ta.remove();
              return true;
            } catch { return false; }
          }
        }

        function confirmDialog(message, title) {
          return new Promise((resolve) => {
            const overlay = el("div", "overlay center");
            const card = el("div", "modal-card");
            if (title) card.appendChild(el("h3", "modal-title", title));
            card.appendChild(el("p", "confirm-text", message));
            const foot = el("div", "modal-foot");
            const cancel = el("button", "btn", "Cancel");
            const ok = el("button", "btn danger", "Delete");
            cancel.onclick = () => { overlay.remove(); resolve(false); };
            ok.onclick = () => { overlay.remove(); resolve(true); };
            foot.append(cancel, ok);
            card.appendChild(foot);
            overlay.appendChild(card);
            document.body.appendChild(overlay);
            overlay.addEventListener("keydown", (e) => { if (e.key === "Escape") { overlay.remove(); resolve(false); } });
            setTimeout(() => ok.focus(), 0);
          });
        }

        function openDrawer({ title, subtitle, width, body, footer, onClose }) {
          const overlay = el("div", "overlay");
          const drawer = el("div", "drawer" + (width === "wide" ? " wide" : ""));
          const head = el("div", "drawer-head");
          const t = el("h3", "", title);
          if (subtitle) t.appendChild(el("div", "cell-sub", subtitle));
          head.appendChild(t);
          const closeBtn = el("button", "icon-btn", "✕");
          closeBtn.title = "Close (Esc)";
          closeBtn.onclick = close;
          head.appendChild(closeBtn);
          const bodyEl = el("div", "drawer-body");
          bodyEl.appendChild(body);
          drawer.append(head, bodyEl);
          if (footer) drawer.appendChild(footer);
          overlay.appendChild(drawer);
          document.body.appendChild(overlay);
          const esc = (e) => { if (e.key === "Escape") close(); };
          document.addEventListener("keydown", esc);
          function close() {
            document.removeEventListener("keydown", esc);
            overlay.remove();
            if (onClose) onClose();
          }
          return { close };
        }

        function drawerFoot() { return el("div", "drawer-foot"); }

        // ───────────────────────── formatting ─────────────────────────
        function fmtDate(s) {
          if (!s) return "—";
          const d = new Date(s);
          return isNaN(d) ? "—" : d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        }
        function fmtMoney(n) {
          if (n == null) return "—";
          const v = Number(n);
          return "$" + (v % 1 === 0 ? v.toFixed(0) : v.toFixed(4).replace(/0+$/, "").replace(/\.$/, ""));
        }
        function infOr(n) { return n === -1 || n === null || n === undefined ? "∞" : String(n); }
        function limitChip(label, value) {
          const c = el("span", "mini-chip", label + " ");
          c.appendChild(el("b", "", infOr(value)));
          return c;
        }
        function roleKind(roleId) {
          if (roleId === "admin") return "danger";
          if (roleId === "vip") return "gold";
          if (roleId === "pro") return "accent";
          return "";
        }
        function roleBadge(roleId) {
          return badge(roleId, roleKind(roleId));
        }
        function expired(d) {
          return d && new Date(d).getTime() < Date.now();
        }

        // ───────────────────────── auth / boot ─────────────────────────
        function showLogin() {
          loginView.classList.remove("hidden");
          appView.classList.add("hidden");
        }
        function showApp() {
          loginView.classList.add("hidden");
          appView.classList.remove("hidden");
        }

        async function login() {
          const username = document.getElementById("login-user").value.trim();
          const password = document.getElementById("login-pass").value;
          const errEl = document.getElementById("login-err");
          errEl.textContent = "";
          try {
            const res = await fetch("/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            let data = null;
            try { data = await res.json(); } catch {}
            if (!res.ok) {
              const msg = data && typeof data.detail === "string" ? data.detail : "Invalid credentials";
              throw new Error(msg);
            }
            localStorage.setItem(TOKEN_KEY, data.access_token);
            await boot();
          } catch (err) {
            errEl.textContent = err.message;
          }
        }

        function logout() {
          localStorage.removeItem(TOKEN_KEY);
          showLogin();
        }

        // ───────────────────────── router ─────────────────────────
        function navigate() {
          const page = location.hash.replace(/^#\/?/, "") || "providers";
          document.querySelectorAll(".nav-item").forEach((n) => {
            n.classList.toggle("active", n.dataset.page === page);
          });
          const renderers = {
            providers: renderProvidersPage,
            roles: renderRolesPage,
            users: renderUsersPage,
            tokens: renderTokensPage,
            tools: renderToolsPage,
            rag: renderRagPage,
            "intent-registry": renderRegistryPage,
            observability: renderObservabilityPage,
          };
          (renderers[page] || renderProvidersPage)();
        }

        async function boot() {
          if (!token()) { showLogin(); return; }
          try {
            const me = await apiFetch("/admin/me");
            document.getElementById("admin-name").textContent = me.username;
            document.getElementById("admin-avatar").textContent = (me.username || "A")[0].toUpperCase();
            showApp();
            navigate();
          } catch { showLogin(); }
        }

        // ───────────────────────── PROVIDERS ─────────────────────────
        let providerTab = "credentials";

        async function renderProvidersPage() {
          content.innerHTML = "";
          const head = el("div", "page-head");
          const t = el("div");
          t.appendChild(el("h2", "", "Providers"));
          t.appendChild(el("div", "sub", "Credential endpoints, model catalog, and routing weights"));
          head.appendChild(t);
          content.appendChild(head);

          const tabs = el("div", "tabs");
          for (const [key, label] of [["credentials", "Credentials"], ["models", "Model Catalog"], ["routes", "Routing & Weights"], ["chat-test", "Chat Test"]]) {
            const tab = el("div", "tab" + (providerTab === key ? " active" : ""), label);
            tab.onclick = () => { providerTab = key; renderProvidersPage(); };
            tabs.appendChild(tab);
          }
          content.appendChild(tabs);

          const section = el("div");
          content.appendChild(section);
          if (providerTab === "credentials") await renderCredentials(section);
          else if (providerTab === "models") await renderModels(section);
          else if (providerTab === "routes") await renderRoutes(section);
          else await renderChatTest(section);
        }

        // ── Credentials tab ──
        async function renderCredentials(container) {
          container.innerHTML = '<div class="loading">Loading…</div>';
          let creds, routes;
          try {
            [creds, routes] = await Promise.all([
              apiFetch("/admin/credentials").then((d) => d.credentials || []),
              apiFetch("/admin/routes").then((d) => d.routes || []),
            ]);
          } catch (e) { container.innerHTML = ""; container.appendChild(errBox(e)); return; }
          container.innerHTML = "";

          const bar = el("div", "bar-row");
          const title = el("div", "bar-title", "Credentials ");
          title.appendChild(el("span", "count", "(" + creds.length + ")"));
          const add = el("button", "btn primary", "+ New credential");
          add.onclick = () => credentialForm(null, { routes });
          bar.append(title, add);
          container.appendChild(bar);

          if (!creds.length) {
            container.appendChild(emptyState("No credentials yet — add your first provider endpoint."));
            return;
          }
          const { wrap, tbody } = table(["Name", "Base URL", "API Key", "Routes", "Price", "Active", "Created", ""]);
          for (const c of creds) {
            const row = el("tr");
            row.appendChild(td(c.name));
            row.appendChild(td(el("span", "code", c.base_url)));
            row.appendChild(td(keyChip(c.api_key_set)));
            const n = routes.filter((r) => r.credential_id === c.id).length;
            row.appendChild(td(el("span", "muted", n ? n + " route" + (n > 1 ? "s" : "") : "—")));
            row.appendChild(priceCell(c));
            const tdSw = td();
            tdSw.appendChild(switchToggle(c.is_active, async (on) => {
              try {
                await apiFetch("/admin/credentials/" + c.id, { method: "PATCH", body: JSON.stringify({ is_active: on }) });
                toast(on ? "Credential enabled" : "Credential disabled");
              } catch (e) { toast(e.message, "err"); renderProvidersPage(); }
            }));
            row.appendChild(tdSw);
            row.appendChild(td(el("span", "muted", fmtDate(c.created_at))));
            row.appendChild(td(actionBtns([
              { label: "Edit", onClick: () => credentialForm(c, { routes }) },
              { label: "Delete", danger: true, onClick: () => deleteCredential(c, routes) },
            ])));
            tbody.appendChild(row);
          }
          container.appendChild(wrap);
        }

        function keyChip(apiKeySet) {
          const chip = el("span", "key-chip");
          chip.appendChild(el("span", "", apiKeySet ? maskKey("sk-" + "•".repeat(24)) : "—"));
          const dot = el("span", "badge " + (apiKeySet ? "ok" : "danger"), apiKeySet ? "set" : "missing");
          chip.appendChild(dot);
          return chip;
        }

        // Derived price: route override else catalog; multiple routes → min…max range.
        function priceText(pMin, pMax) {
          if (pMin == null) return "—";
          if (pMax != null && Number(pMax) !== Number(pMin)) return fmtMoney(pMin) + " – " + fmtMoney(pMax);
          return fmtMoney(pMin);
        }
        function priceCell(c) {
          if (!c.model_count) return td(el("span", "muted", "—"));
          const t = el("div");
          t.appendChild(el("span", "code", priceText(c.price_prompt_min, c.price_prompt_max)));
          t.appendChild(el("div", "cell-sub", "out " + priceText(c.price_completion_min, c.price_completion_max)));
          return td(t);
        }
        function modelChips(c) {
          const ms = (c.models || []).slice(0, 3);
          const chips = ms.map((m) => {
            const chip = el("span", "mini-chip");
            chip.appendChild(el("b", "", m.model_name || "?"));
            if (m.provider_model_name && m.provider_model_name !== m.model_name) {
              chip.appendChild(el("div", "cell-sub", m.provider_model_name));
            }
            return chip;
          });
          if ((c.models || []).length > 3) chips.push(el("span", "mini-chip", "+" + ((c.models || []).length - 3)));
          return chips.length ? chips : [el("span", "muted", "no routes")];
        }

        function credentialForm(cred, ctx) {
          const isEdit = !!cred;
          const name = textInput(cred ? cred.name : "", { placeholder: "e.g. deepseek" });

        // ── Chat Test tab ──
        // Autocomplete test-account picker: prefix → substring → fuzzy char-order
        // match against username / display name; max 8 suggestions. Selecting a
        // suggestion records a hidden user id; empty (or unmatched free text) = guest.
        function userAutocomplete(users) {
          const wrap = el("div", "user-ac");
          const input = textInput("", { placeholder: "Type username or display name…" });
          const list = el("div", "user-ac-list");
          list.style.display = "none";
          wrap.append(input, list);
          let chosen = null; // { id, label }

          const norm = (s) => String(s || "").toLowerCase();
          const fuzzy = (q, t) => {
            let i = 0;
            for (const ch of q) {
              i = t.indexOf(ch, i);
              if (i === -1) return false;
              i++;
            }
            return true;
          };
          const label = (u) => (u.display_name || u.username) + " (" + u.username + ")" + (u.is_active ? "" : " — inactive");
          const suggest = (qRaw) => {
            const q = norm(qRaw.trim());
            if (!q) return [];
            const scored = [];
            for (const u of users) {
              const name = u.display_name || u.username;
              const hay = norm([name, u.username, u.display_name].filter(Boolean).join(" "));
              let score = -1;
              if (norm(u.username).startsWith(q) || norm(name).startsWith(q)) score = 0;
              else if (hay.includes(q)) score = 1;
              else if (fuzzy(q, hay)) score = 2;
              if (score === -1) continue;
              scored.push({ u, score });
            }
            scored.sort((a, b) => a.score - b.score || norm(a.u.username).localeCompare(norm(b.u.username)));
            return scored.slice(0, 8).map((s) => s.u);
          };

          const renderList = () => {
            list.innerHTML = "";
            const items = suggest(input.value);
            if (!items.length) { list.style.display = "none"; return; }
            for (const u of items) {
              const it = el("div", "user-ac-item", label(u));
              it.onclick = () => {
                chosen = { id: u.id, label: label(u) };
                input.value = chosen.label;
                list.style.display = "none";
              };
              list.appendChild(it);
            }
            list.style.display = "block";
          };

          input.oninput = () => { chosen = null; renderList(); };
          input.onfocus = () => renderList();
          input.onkeydown = (e) => {
            if (e.key === "Enter") {
              const items = suggest(input.value);
              if (items.length) {
                const u = items[0];
                chosen = { id: u.id, label: label(u) };
                input.value = chosen.label;
              } else {
                chosen = null; // unmatched free text → treat as guest
              }
              list.style.display = "none";
              e.preventDefault();
            } else if (e.key === "Escape") {
              list.style.display = "none";
            }
          };
          document.addEventListener("mousedown", (e) => {
            if (!wrap.contains(e.target)) list.style.display = "none";
          });

          return { root: wrap, getUserId: () => (chosen ? chosen.id : null) };
        }

        async function renderToolsPage() {
          content.innerHTML = "";
          const head = el("div", "page-head");
          const t = el("div");
          t.appendChild(el("h2", "", "Tools config"));
          t.appendChild(el("div", "sub", "Central configuration for external tools (search engines, email, maps…). Fields are stored under the generic tools namespace."));
          head.appendChild(t);
          content.appendChild(head);

          let cfg;
          try { cfg = await apiFetch("/config"); }
          catch (e) { content.appendChild(errBox(e)); return; }
          const tools = cfg.tools || {};

          for (const tool of TOOLS) {
            const card = el("div", "legacy-card");
            card.appendChild(el("div", "section-title", tool.title + (tool.disabled ? " — pending" : "")));
            card.appendChild(el("div", "hint", tool.desc));

            if (tool.disabled || tool.fields.length === 0) {
              if (tool.disabled) card.appendChild(el("div", "hint", "Coming soon — nothing to configure yet."));
              content.appendChild(card);
              continue;
            }

            const cur = tools[tool.id] || {};
            const inputs = {};
            for (const f of tool.fields) {
              let input;
              if (f.type === "bool") {
                input = switchToggle(cur[f.key] !== false, null);
              } else if (f.type === "number") {
                input = textInput(cur[f.key] != null ? String(cur[f.key]) : (f.def || ""));
                input.type = "number";
              } else if (f.type === "password") {
                // Pre-fill the stored value (masked) so a configured secret is visibly set,
                // with a reveal eye and a copy button. Saving an unchanged value keeps it.
                const secret = cur[f.key] != null ? String(cur[f.key]) : "";
                input = textInput(secret, { type: "password", placeholder: f.ph || "" });
                const eye = el("button", "btn secret-btn", "👁");
                eye.type = "button";
                eye.title = "Show / hide";
                eye.onclick = () => { input.type = input.type === "password" ? "text" : "password"; };
                const copyBtn = el("button", "btn secret-btn", "Copy");
                copyBtn.type = "button";
                copyBtn.disabled = !secret;
                copyBtn.onclick = async () => {
                  if (!input.value) return;
                  try { await navigator.clipboard.writeText(input.value); } catch { /* clipboard unavailable */ }
                };
                const wrap = el("div", "secret-row");
                wrap.append(input, eye, copyBtn);
                card.appendChild(field(f.label, wrap));
                inputs[f.key] = input;
                continue;
              } else {
                input = textInput(cur[f.key] != null ? String(cur[f.key]) : (f.def || ""), { placeholder: f.ph || "" });
              }
              inputs[f.key] = input;
              card.appendChild(field(f.label, input));
            }

            // ── Dynamic key-value rows: user-defined extra params ──
            const reserved = new Set(tool.reserved || []);
            const declaredKeys = new Set(tool.fields.map((f) => f.key));
            const kv = el("div");
            const kvRows = [];
            const addKvRow = (k, v) => {
              const row = el("div", "kv-row");
              const kIn = textInput(k || "", { placeholder: "field name" });
              const vIn = textInput(v != null ? String(v) : "", { placeholder: "value" });
              const del = el("button", "btn ghost", "✕");
              del.onclick = () => row.remove();
              row.append(kIn, vIn, del);
              kv.appendChild(row);
              kvRows.push({ kIn, vIn });
            };
            for (const [k, v] of Object.entries(cur)) {
              if (!declaredKeys.has(k) && !reserved.has(k)) addKvRow(k, v);
            }
            const kvHead = el("div", "section-sub", "Dynamic fields");
            const kvHint = el("div", "hint", "Add any field name/value pair — stored under tools.<id>.<name>. Tool code reads them by name via get_tool_config(\"" + tool.id + "\").");
            const addBtn = el("button", "btn ghost", "+ Add field");
            addBtn.onclick = () => addKvRow("", "");
            kvHead.appendChild(kvHint);
            card.appendChild(kvHead);
            card.appendChild(kv);
            card.appendChild(addBtn);

            const save = el("button", "btn primary", "Save");
            const saveRes = el("div", "test-res");
            save.onclick = async () => {
              save.disabled = true;
              saveRes.textContent = "";
              const values = {};
              for (const f of tool.fields) {
                if (f.type === "bool") values[f.key] = inputs[f.key].classList.contains("on");
                else if (f.type === "number") values[f.key] = parseInt(inputs[f.key].value, 10) || parseInt(f.def || "0", 10);
                else values[f.key] = inputs[f.key].value.trim();
              }
              for (const r of kvRows) {
                const k = r.kIn.value.trim();
                if (!k || reserved.has(k) || declaredKeys.has(k)) continue;
                values[k] = r.vIn.value.trim();
              }
              try {
                await apiFetch("/config", { method: "POST", body: JSON.stringify({ tools: { [tool.id]: values } }) });
                saveRes.textContent = "✓ Saved";
                saveRes.className = "test-res ok";
              } catch (e) {
                saveRes.textContent = "✗ " + e.message;
                saveRes.className = "test-res err";
              }
              save.disabled = false;
            };
            const row = el("div", "row-actions");
            row.append(save, saveRes);
            card.appendChild(row);

            if (tool.test) {
              const testTo = textInput("", { placeholder: "recipient@example.com" });
              const testBtn = el("button", "btn ghost", tool.test.label);
              const testRes = el("div", "test-res");
              testBtn.onclick = async () => {
                if (!testTo.value.trim()) { testRes.textContent = "Enter a recipient first"; testRes.className = "test-res err"; return; }
                testBtn.disabled = true;
                testRes.textContent = "";
                try {
                  const r = await apiFetch(tool.test.endpoint, { method: "POST", body: JSON.stringify({ to_email: testTo.value.trim() }) });
                  testRes.textContent = "✓ " + (r.message || "Sent");
                  testRes.className = "test-res ok";
                } catch (e) {
                  testRes.textContent = "✗ " + e.message;
                  testRes.className = "test-res err";
                }
                testBtn.disabled = false;
              };
              const trow = el("div", "cfg-row");
              trow.append(field("Send a test email to", testTo), testBtn, testRes);
              card.appendChild(trow);
            }

            if (tool.id === "web_search") {
              // Connectivity test: runs the values currently in the form (blank secret → the
              // stored one) through one real basic-depth search. Never echoes the key.
              const tq = textInput("", { placeholder: "Test query (default: web search connectivity test)" });
              const tbtn = el("button", "btn ghost", "Test search");
              const tres = el("div", "test-res");
              tbtn.onclick = async () => {
                if (tbtn.disabled) return;
                tbtn.disabled = true;
                tres.textContent = "";
                const payload = { query: tq.value.trim() };
                for (const k of ["provider", "api_key", "engine_id"]) {
                  const v = inputs[k] ? inputs[k].value.trim() : "";
                  if (v) payload[k] = v;
                }
                try {
                  const r = await apiFetch("/config/test-web-search", { method: "POST", body: JSON.stringify(payload) });
                  if (r.status === "ok") {
                    const head = "✓ " + (r.provider || "provider") + " · " + r.count + " results";
                    tres.textContent = r.title ? head + " · " + r.title : head;
                    tres.className = "test-res ok";
                  } else {
                    tres.textContent = "✗ " + (r.error_type || "error") + ": " + (r.error || "search failed");
                    tres.className = "test-res err";
                  }
                } catch (e) {
                  tres.textContent = "✗ " + e.message;
                  tres.className = "test-res err";
                }
                tbtn.disabled = false;
              };
              const wrow = el("div", "cfg-row");
              wrow.append(field("Web search connectivity test", tq), tbtn, tres);
              card.appendChild(wrow);
            }

            content.appendChild(card);
          }
        }

        function modelMultiSelect(selected, models) {
          const wrap = el("div", "chip-group");
          for (const m of models) {
            const lbl = el("label", "chip-toggle");
            const cb = el("input");
            cb.type = "checkbox";
            cb.checked = (selected || []).includes(m.name);
            const chip = el("span", "chip", m.name);
            lbl.append(cb, chip);
            wrap.appendChild(lbl);
          }
          return wrap;
        }
        function readChipSelection(wrap) {
          return [...wrap.querySelectorAll("input[type=checkbox]:checked")].map((i) => i.parentElement.querySelector(".chip").textContent.trim());
        }

        function roleForm(role, ctx) {
          const isEdit = !!role;
          const isClone = !!ctx.clone;
          const roleId = textInput(isEdit && !isClone ? role.role_id : "", { placeholder: "e.g. premium", autocomplete: "off" });
          const roleName = textInput(isEdit ? role.role_name || "" : "", { placeholder: "Display name" });
          const daily = numInput(isEdit ? role.daily_request_limit : 50);
          const monthly = numInput(isEdit ? role.monthly_request_limit : 1500);
          const dailyTokens = numInput(isEdit ? role.daily_token_limit : -1);
          const rpm = numInput(isEdit ? role.rpm_limit : -1);
          const cost = numInput(isEdit ? role.monthly_cost_limit : -1, { step: "0.01" });
          const defaultModel = textInput(isEdit ? role.default_model || "" : "", { placeholder: "Blank = active provider" });
          const modelChips = modelMultiSelect(isEdit ? role.models : [], ctx.models);
          const features = el("textarea");
          features.placeholder = '{ "chat": true, "web": false }';
          features.value = JSON.stringify(isEdit ? role.features || {} : {}, null, 2);
          const active = switchToggle(isEdit ? role.is_active : true);

          const body = el("div");
          body.append(
            field("Role ID", roleId, isEdit && !isClone ? "Not editable after creation." : "Lowercase id used in tokens and user records."),
            field("Role name", roleName)
          );
          const row1 = el("div", "field-row");
          row1.append(field("Daily requests", daily, "-1 = unlimited"), field("Monthly requests", monthly, "-1 = unlimited"));
          body.appendChild(row1);
          const row2 = el("div", "field-row");
          row2.append(field("Daily tokens", dailyTokens, "-1 = unlimited"), field("RPM", rpm, "-1 = unlimited"));
          body.appendChild(row2);
          body.appendChild(field("Monthly cost cap ($)", cost, "-1 = no cap"));
          body.appendChild(field("Default model", defaultModel));
          body.appendChild(field("Allowed models", modelChips, "Leave empty = all models"));
          body.appendChild(field("Features (JSON)", features));
          const activeRow = el("div", "switch-row");
          activeRow.append(active, el("span", "muted", "Accounts with this role can use the service"));
          body.appendChild(field("Active", activeRow));

          const foot = drawerFoot();
          const save = el("button", "btn primary", isClone ? "Create clone" : isEdit ? "Save changes" : "Create role");
          save.onclick = async () => {
            if (!roleId.value.trim()) { toast("Role ID is required", "err"); return; }
            let parsed;
            try { parsed = JSON.parse(features.value || "{}"); }
            catch { toast("Features is not valid JSON", "err"); return; }
            save.disabled = true;
            const payload = {
              role_id: roleId.value.trim(),
              role_name: roleName.value.trim(),
              daily_request_limit: parseInt(daily.value || "-1", 10),
              monthly_request_limit: parseInt(monthly.value || "-1", 10),
              daily_token_limit: parseInt(dailyTokens.value || "-1", 10),
              rpm_limit: parseInt(rpm.value || "-1", 10),
              monthly_cost_limit: parseFloat(cost.value || "-1"),
              default_model: defaultModel.value.trim(),
              models: readChipSelection(modelChips),
              features: parsed,
              is_active: active.classList.contains("on"),
            };
            try {
              if (isEdit && !isClone) {
                delete payload.role_id;
                await apiFetch("/admin/roles/" + role.role_id, { method: "PATCH", body: JSON.stringify(payload) });
              } else {
                await apiFetch("/admin/roles", { method: "POST", body: JSON.stringify(payload) });
              }
              toast(isClone ? "Role cloned" : isEdit ? "Role saved" : "Role created");
              drawer.close();
              renderRolesPage();
            } catch (e) { toast(e.message, "err"); }
            save.disabled = false;
          };
          foot.appendChild(save);
          const drawer = openDrawer({
            title: isClone ? "Clone role" : isEdit ? "Edit role" : "New role",
            subtitle: isEdit && !isClone ? role.role_id : "Define a quota/feature tier",
            body, footer: foot,
          });
        }

        async function deleteRole(r) {
          if (!(await confirmDialog(`Delete role "${r.role_id}"?`, "Delete role"))) return;
          try {
            await apiFetch("/admin/roles/" + r.role_id, { method: "DELETE" });
            toast("Role deleted");
            renderRolesPage();
          } catch (e) {
            toast(e.message, "err");
            if (String(e.message).indexOf("409") === 0) {
              toast("Tip: set is_active=false to retire it instead of deleting", "err");
            }
          }
        }

            list.innerHTML = "";

              list.appendChild(el("div", "empty", "No credentials yet — add them under Providers."));
              return;

              const price = el("span", "chan-price", priceText(c.price_prompt_min, c.price_prompt_max));
