services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deepgloss-postgres
    environment:
      POSTGRES_USER: deepgloss
      POSTGRES_PASSWORD: deepgloss
      POSTGRES_DB: deepgloss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepgloss"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deepgloss-redis
    ports:
      # 6379 sits inside a Windows Hyper-V excluded port range on some hosts; use 16379 instead.
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
