[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepdive"
version = "0.1.0"
description = "AI learning workbench: vocabulary + video + document + AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    # Data
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Cache / queue
    "redis>=5.0",
    "arq>=0.26",
    # LLM
    "openai>=1.30",
    "litellm>=1.40",
    "tenacity>=8.2",
    "structlog>=24.0",
    # NOTE: TTS (Kokoro) and embedding (BGE-M3) run as separate Docker services;
    # the API only calls them over HTTP via `openai` / `httpx` (declared above).
    # MCP
    "fastmcp>=0.2",
    # CJK keyword channel (jieba segmentation; lazy-imported on first CJK query/ingest)
    "jieba>=0.42",
    # Document parsing for the query repository: PyMuPDF (PDF text + table detection →
    # vision transcription), python-docx (Word .docx). Both lazy-imported in
    # core/infrastructure/{pdf,ingest}.py so the API stays light until a file is ingested.
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    # Slide generation: python-pptx backs the doc_slides agent tool (text-only .pptx) and
    # desktop Generate PPT. Lazy-imported in core/infrastructure/media.py.
    "python-pptx>=0.6.21",
    # gRPC (internal)
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    # Bash sandbox (production path): docker-py for the per-command container sandbox.
    "docker>=7.0",
    # Misc
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
# RAG semantic search (pulls in torch, heavy; install on demand)
rag = [
    "sentence-transformers>=2.7",
]
# Desktop media generation (video → PPT / PDF book)
media = [
    "reportlab>=4.0",
    "imageio-ffmpeg>=0.4.9",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/agent",
    "packages/rag",
    "packages/core",
    "packages/shared/proto/retrieval",
    "apps/api",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's ``Depends(...)`` / ``Query(...)`` in argument defaults is the framework's
# documented DI pattern, not a mutable-default bug (B008 false positive).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Always importable regardless of how pytest is launched (`pytest` vs
# `python -m pytest`): lets tests do `from tests._drive_fakes import ...`.
pythonpath = ["."]
