[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepdive"
version = "0.1.0"
description = "AI learning workbench: vocabulary + video + document + AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    # Data
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Cache / queue
    "redis>=5.0",
    "arq>=0.26",
    # LLM
    "openai>=1.30",
    "litellm>=1.40",
    "tenacity>=8.2",
    # NOTE: TTS (Kokoro) and embedding (BGE-M3) run as separate Docker services;
    # the API only calls them over HTTP via `openai` / `httpx` (declared above).
    # MCP
    "fastmcp>=0.2",
    # gRPC (internal)
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    # Misc
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
# RAG semantic search (pulls in torch, heavy; install on demand)
rag = [
    "sentence-transformers>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/agent",
    "packages/rag",
    "packages/core",
    "packages/shared/proto/retrieval",
    "apps/api",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
