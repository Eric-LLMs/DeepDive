# §8.16 Golden Set — the validation-gate regression matrix for the Intent Funnel.
#
# This is NOT an ad-hoc test list: it is the gate that Registry content and
# node-strategy changes must pass before Rollout (8.16). Cases run
# under execution_mode="test" (8.14: batch cost never lands on a user).
#
# Coverage per 8.16: deterministic match / paraphrase+multilingual / negation /
# ambiguity+multi-intent / missing-arg / viewer+attachment+memory context /
# private+web constraints / sequence dependency / Agent fallback.
#
# expectations speak the 8.10 vocabulary: route + capability + funnel_stage,
# or final agent + fallback_reason (+ matcher/tool_intent trace fragment).
# Chain ruling 2026-09-24: the active lane is Matcher/Recall -> ONE ToolIntentModel
# call -> Binder validate -> certified, so every ACTION row carries
# stage: tool_intent (there is no matcher-direct stage any more).
# Action-Contract ruling 2026-09-25: the Matcher is EXACT-ONLY over the curated
# intent corpus (regex is inert storage), and an empty candidate set still
# reaches ToolIntentModel — FUNNEL_NO_CANDIDATE is retired; the honest exit of
# "nothing on the table" is the model's own NONE -> FUNNEL_TOOL_INTENT_REJECT.

cases:
  - id: det_match_exact_standard
    group: deterministic_match
    settings: {mode: "on"}
    query: '新建文件夹"季度报告"'
    # the standard corpus sentence matches EXACTLY -> HIT; the HIT lane enters
    # the same single ToolIntentModel hop as Recall (chain ruling 2026-09-24).
    expect: {route: action, capability: cap-folder, tool: create_folder,
             stage: tool_intent, kind: action}

  - id: det_regex_is_inert
    group: deterministic_match
    settings: {mode: "on"}
    query: '新建文件夹"实验记录"'
    # the legacy ``re:新建文件夹`` pattern WOULD have hit pre-ruling; the
    # exact-only Matcher never reads it. Recall falls under the quality gate,
    # the empty set still reaches the model, which answers NONE.
    expect: {route: agent, fallback: FUNNEL_TOOL_INTENT_REJECT,
             matcher_contains: "MISS"}

  - id: paraphrase_zh_recall
    group: paraphrase_multilingual
    settings: {mode: "off"}
    query: '创建文件夹"资料归档"'
    expect: {route: action, capability: cap-folder, stage: tool_intent}

  - id: paraphrase_en_recall
    group: paraphrase_multilingual
    settings: {mode: "off"}
    query: 'create a folder named "Read Later"'
    expect: {route: action, capability: cap-folder, stage: tool_intent}

  - id: negation_guard_forces_miss
    group: negation
    settings: {mode: "on"}
    query: '不要新建文件夹"季度报告"'
    # the 8.1-a negation guard applies before any certification; the fake
    # corpus must not resupply the turn through Recall either — the empty
    # candidate set reaches the model, whose NONE is the honest exit.
    expect: {route: agent, fallback: FUNNEL_TOOL_INTENT_REJECT,
             matcher_contains: "MISS"}

  - id: ambiguous_two_intents_escalates
    group: ambiguity_multi_intent
    # ONE sentence curated under BOTH action caps — the only way the
    # exact-only Matcher can produce AMBIGUOUS; the one ToolIntentModel hop
    # answers NONE on the split pair (no arbiter exists any more) — Agent keeps
    # the turn.
    settings: {mode: "on"}
    query: '新建文件夹"季度报告"并把"keystone"加入我的工程词汇库'
    expect: {route: agent, fallback: FUNNEL_TOOL_INTENT_REJECT,
             matcher_contains: "AMBIGUOUS"}

  - id: missing_argument_last_question
    group: missing_argument
    settings: {mode: "on"}
    query: '新建文件夹'
    # a curated synonym -> HIT; ToolIntentModel selects cap-folder but the
    # sentence carries no quotable name -> Binder validate exits MISSING
    # (8.7): the Agent owns the clarification, no second hop tries to rescue it.
    expect: {route: agent, fallback: FUNNEL_BIND_MISSING,
             matcher_contains: "HIT:cap-folder"}

  - id: viewer_and_attachment_do_not_block
    group: context_viewer_attachment_memory
    settings: {mode: "on"}
    query: '新建文件夹"季度报告"'
    ctx: {viewer_page: 3, attach: true, session: s-golden}
    expect: {route: action, capability: cap-folder, stage: tool_intent}

  - id: sequence_followup_not_guessed
    group: sequence_dependency
    settings: {mode: "on"}
    query: '再来一个'
    ctx: {session: s-golden}
    # bare follow-up: table miss, vector miss — the funnel never guesses from
    # history; the unconditional model call answers NONE, the Agent owns context.
    expect: {route: agent, fallback: FUNNEL_TOOL_INTENT_REJECT}

  - id: private_kind_gate_closed
    group: private_web_constraints
    settings: {mode: "on", private: false}
    query: '创建文件夹"私密日记"'
    # IN the table, NOT ON the gate: same verdict as if the row were absent.
    expect: {route: agent, fallback: FUNNEL_KIND_DISABLED}

  - id: private_kind_gate_open
    group: private_web_constraints
    settings: {mode: "on", private: true}
    query: '创建文件夹"私密日记"'
    expect: {route: action, capability: cap-private, kind: private}

  - id: web_kind_gate_closed
    group: private_web_constraints
    settings: {mode: "on"}
    query: '查一下这个词的词源'
    expect: {route: agent, fallback: FUNNEL_KIND_DISABLED}

  - id: agent_fallback_plain_chat
    group: agent_fallback
    settings: {mode: "on"}
    query: '今天想学点什么好'
    expect: {route: agent, fallback: FUNNEL_TOOL_INTENT_REJECT}
