# L2/L3 Session trajectories — fixed ground-truth behavior chains (the addition
# ruling: sessions are stored WHOLE, never flattened into unrelated queries).
# Policy (see DESIGN.md §A-3): anaphoric turns are expected AGENT at the CURRENT
# capability baseline (the funnel never reads history — golden
# sequence_followup_not_guessed); each such pair includes a self-contained
# contrast turn so the same goal is also exercised as TOOL.
# `asst` = canned assistant reply for replay realism; it is NEVER fed to
# funnel nodes. `delta` mutates Virtual Shadow State only.
sessions:
  - id: sess-drift-paper-01
    scenario: S9_CONTEXT_DRIFT
    goal: 读论文 → 概念追问 → 归档动作 → 生活跑题 → 回到内容
    viewer: {kind: document, asset_id: ast-nlp-survey, title: "NLP 综述:Transformer 之后"}
    turns:
      - {q: '这篇论文主要讲了什么?', intent: DOCUMENT_GROUNDED_QA, vrel: GROUNDED_IN_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: '这篇综述梳理了 Transformer 之后 NLP 的三条主线……'}
      - {q: '里面的 NER 是什么意思?', intent: CONTEXTUAL_QA, vrel: RELATED_BUT_NOT_IN_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: 'NER 指命名实体识别,就是从文本里抽出人名地名……'}
      - {q: '对了,西红柿怎么做好吃?', intent: CONTEXT_DRIFT, vrel: UNRELATED_DRIFT, diff: EASY, exp: {funnel: AGENT}, asst: '番茄炒蛋最稳妥:蛋液先炒到半熟……'}
      - {q: '帮我把这篇论文的相关内容建个档,新建一个 research 文件夹', intent: TOOL_ACTION, vrel: RELATED_BUT_NOT_IN_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: research}, delta: {folders: {research: vfolder-research}}}, asst: '已记录:research 目录准备就绪(评测虚拟状态,未真实执行)'}
      - {q: '综述里说的 MoE 算第四条主线吗?', intent: DOCUMENT_GROUNDED_QA, vrel: GROUNDED_IN_VIEWER, diff: MEDIUM, exp: {funnel: AGENT}, asst: '可以算:近两年的推理成本主线正是 MoE 化……'}
  - id: sess-create-rename-01
    scenario: S7_TOOL_ACTION
    goal: 建文件夹 → 改名指代(基线外)→ 自包含重述(基线内)
    viewer: {kind: none}
    turns:
      - {q: '创建一个叫 research 的文件夹', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: EASY, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: research}, delta: {folders: {research: vfolder-research}}}, asst: '好的,research 文件夹准备就绪(虚拟状态)'}
      - {q: '名字改成 papers', intent: FOLLOW_UP, vrel: NO_VIEWER, diff: HARD, exp: {funnel: AGENT}, notes: future_anaphora, asst: '你指的是刚才那个 research 文件夹吗?我目前没有改名能力,要 Agent 帮你跟进吗?'}
      - {q: '那再建一个名叫 "papers" 的文件夹,里面放论文清单', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: papers}, delta: {folders: {papers: vfolder-papers}}}, asst: '已记录:papers 目录(虚拟状态)'}
  - id: sess-ner-qa-01
    scenario: S2_WATCHING
    goal: 看 NER 视频 → 外延知识 → 顺势收词
    viewer: {kind: video, asset_id: ast-ner-talk, title: "传统 NLP 技术盘点"}
    turns:
      - {q: '视频里说传统 NLP 的 NER 已经过时了,NER 到底是什么?', intent: KNOWLEDGE_QA, vrel: RELATED_BUT_NOT_IN_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: NER=命名实体识别;说"过时"指的是被统一模型吞并了任务头……}
      - {q: 'NER 和 Transformer 有什么关系?', intent: KNOWLEDGE_QA, vrel: RELATED_BUT_NOT_IN_VIEWER, diff: MEDIUM, exp: {funnel: AGENT}, asst: 'Transformer 提供了上下文表示,让序列标注换成 span 式抽取……'}
      - {q: '把 named entity recognition 加入我的 NLP 词汇库', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: EASY, exp: {funnel: TOOL, cap: cap-add-term, args: {term: named entity recognition, domain: NLP|NLP词汇库}, delta: {terms: [{term: named entity recognition, domain: NLP}]}}, asst: '已记入:NLP 词汇库 +1(虚拟状态)'}
  - id: sess-extract-01
    scenario: S1_READING
    goal: 读文档 → 提取全文(真工具)→ 基于结果继续(指代,基线外)
    viewer: {kind: document, asset_id: ast-nlp-survey, has_attachment: true}
    turns:
      - {q: '这篇综述的实验部分可信吗?', intent: DOCUMENT_GROUNDED_QA, vrel: GROUNDED_IN_VIEWER, diff: MEDIUM, exp: {funnel: AGENT}, asst: '主要看三个坑:基线选择、数据切分、评测集泄漏……'}
      - {q: '提取全文', intent: TOOL_ACTION, vrel: GROUNDED_IN_VIEWER, diff: EASY, exp: {funnel: TOOL, cap: cap-pdf-extract-text, args: {asset_id: ast-nlp-survey}, delta: {extracted: [ast-nlp-survey]}}, asst: '提取完成(虚拟):共 12 页文本'}
      - {q: '把提取出来的内容翻译成英文', intent: FOLLOW_UP, vrel: GROUNDED_IN_VIEWER, diff: HARD, exp: {funnel: AGENT}, notes: "post-tool follow-up depends on resolved asset content — upstream resolver territory", asst: '好,以下是对照译文……'}
  - id: sess-addterm-01
    scenario: S6_WORKSPACE
    goal: 收词 → 省略指代(基线外)→ 自包含对照
    viewer: {kind: none}
    turns:
      - {q: '把 "keystone" 加入工程词汇库', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: EASY, exp: {funnel: TOOL, cap: cap-add-term, args: {term: keystone, domain: 工程|工程词汇库}, delta: {terms: [{term: keystone, domain: 工程}]}}, asst: '已记入工程词汇库(虚拟)'}
      - {q: 'quorum 也收进来吧', intent: FOLLOW_UP, vrel: NO_VIEWER, diff: HARD, exp: {funnel: AGENT}, notes: future_anaphora, asst: '你想加到刚才的"工程"词库吗?(当前漏斗不猜历史,由 Agent 澄清)'}
      - {q: '把 "quorum" 加入工程词汇库', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: EASY, exp: {funnel: TOOL, cap: cap-add-term, args: {term: quorum, domain: 工程|工程词汇库}, delta: {terms: [{term: quorum, domain: 工程}]}}, asst: '已记入(虚拟)'}
  - id: sess-research-01
    scenario: S4_RESEARCH
    goal: 深度研究立项(准入拒走 ABSTAIN)→ 放弃 → 生活话题 → 回流建目录
    viewer: {kind: none}
    turns:
      - {q: '启动深度研究:系统综述 2026 年的多模态模型格局', intent: RESEARCH, vrel: NO_VIEWER, diff: EASY, exp: {funnel: ABSTAIN}, notes: "research handoff veto: cascade must not run", asst: '已转研究通道……'}
      - {q: '算了不查了,今天天气怎么样?', intent: CONTEXT_DRIFT, vrel: NO_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: '我这边没有实时天气源,但可以聊聊出门建议……'}
      - {q: '那还是回到学习,新建一个"多模态资料"文件夹', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: 多模态资料}, delta: {folders: {多模态资料: vfolder-mm-notes}}}, asst: '已记录(虚拟)'}
  - id: sess-chitchat-drift-01
    scenario: S8_CHIT_CHAT
    goal: 闲聊 → 突然的自包含工具请求
    viewer: {kind: none}
    turns:
      - {q: '无聊,陪我聊两句', intent: CHIT_CHAT, vrel: NO_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: '好啊,聊点什么?'}
      - {q: '建个"心情日记"文件夹吧', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: 心情日记}, delta: {folders: {心情日记: vfolder-mood}}}, notes: "chit-chat context does not excuse a self-contained action from routing", asst: '已记录(虚拟)'}
  - id: sess-ws-move-01
    scenario: S6_WORKSPACE
    goal: 建目录 → 移动(未发布能力)→ 收词
    viewer: {kind: none}
    turns:
      - {q: '新建"文献库"文件夹', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: EASY, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: 文献库}, delta: {folders: {文献库: vfolder-refs}}}, asst: '已记录(虚拟)'}
      - {q: '把这份 PDF 移动到文献库', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: HARD, exp: {funnel: AGENT}, notes: "move-file capability NOT published: honest baseline label; relabel only in a future dataset version when the cap ships", asst: '目前没有移动能力,我可以记下这个待办……'}
      - {q: '那先把 retrieval 加入向量检索词汇库', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-add-term, args: {term: retrieval, domain: 向量检索|向量检索词汇库}, delta: {terms: [{term: retrieval, domain: 向量检索}]}}, asst: '已记入(虚拟)'}
  - id: sess-video-toolmention-01
    scenario: S2_WATCHING
    goal: 视频里提到工具(讨论)→ 在这里也要一个(执行)
    viewer: {kind: video, asset_id: ast-tool-demo, title: "效率工具演示"}
    turns:
      - {q: '视频里演示的那个自动建目录的插件叫什么?', intent: VIDEO_GROUNDED_QA, vrel: GROUNDED_IN_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: '画面里是某笔记软件的模板功能,不是 Delveta……'}
      - {q: '那在这里也帮我建一个"看片笔记"文件夹', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: 看片笔记}, delta: {folders: {看片笔记: vfolder-watch}}}, asst: '已记录(虚拟)'}
  - id: sess-writing-drift-01
    scenario: S5_WRITING
    goal: 润色 → 顺手建素材目录
    viewer: {kind: none}
    turns:
      - {q: '帮我润色这句话:意图漏斗的误执行风险高于普通分类任务', intent: WRITING, vrel: NO_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: '试改:相较普通分类任务,意图漏斗一旦误执行,代价要高一个量级……'}
      - {q: '顺便新建文件夹"写作素材",刚才那句存进去', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: 写作素材}, delta: {folders: {写作素材: vfolder-writing}}}, asst: '已记录(虚拟)'}
  - id: sess-drift-tomato-01
    scenario: S9_CONTEXT_DRIFT
    goal: 看番茄视频 → 生活问题 → 做饭 → 回视频
    viewer: {kind: video, asset_id: ast-tomato-class, title: "番茄品种分类"}
    turns:
      - {q: '圣女果和串番茄的分类依据是什么?', intent: VIDEO_GROUNDED_QA, vrel: GROUNDED_IN_VIEWER, diff: EASY, exp: {funnel: AGENT}, asst: '视频里按果穗形态分:串果、单果……'}
      - {q: '西红柿现在多少钱一斤?', intent: CONTEXT_DRIFT, vrel: UNRELATED_DRIFT, diff: EASY, exp: {funnel: AGENT}, asst: '我没有实时价格,菜场大致区间……'}
      - {q: '那番茄炒蛋用哪种番茄好?', intent: CONTEXT_DRIFT, vrel: BEYOND_VIEWER, diff: MEDIUM, exp: {funnel: AGENT}, asst: '沙瓤大番茄更适合炒蛋……'}
      - {q: '回到视频,刚才说的品种分类再讲讲抗裂性', intent: FOLLOW_UP, vrel: GROUNDED_IN_VIEWER, diff: MEDIUM, exp: {funnel: AGENT}, asst: '抗裂性主要和果皮角质层厚度有关……'}
  - id: sess-hard5-01
    scenario: S7_TOOL_ACTION
    goal: 五轮压力链:正-否-缓-歧义-正(A/B first-divergence 的富矿)
    viewer: {kind: none}
    turns:
      - {q: '帮我建个"季度复盘"文件夹', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: EASY, exp: {funnel: TOOL, cap: cap-create-folder, args: {name: 季度复盘}, delta: {folders: {季度复盘: vfolder-q}}}, asst: '已记录(虚拟)'}
      - {q: '不要创建"临时垃圾"文件夹', intent: HARD_NEGATIVE_NEGATED, vrel: NO_VIEWER, diff: ADVERSARIAL, exp: {funnel: AGENT}, asst: '明白,没有创建任何目录'}
      - {q: '词库的事先放着,不急', intent: HARD_NEGATIVE_DEFER_EXECUTE, vrel: NO_VIEWER, diff: ADVERSARIAL, exp: {funnel: AGENT}, asst: '好的,先记着这回事'}
      - {q: '新建"归档A"和"归档B"两个文件夹', intent: HARD_NEGATIVE_AMBIGUOUS, vrel: NO_VIEWER, diff: ADVERSARIAL, exp: {funnel: AMBIGUOUS}, notes: "two folder creations: multi-action, single hop must not certify one arbitrarily", asst: '这句话包含两个创建动作……'}
      - {q: '那先把 durable 加入分布式词汇库', intent: TOOL_ACTION, vrel: NO_VIEWER, diff: MEDIUM, exp: {funnel: TOOL, cap: cap-add-term, args: {term: durable, domain: 分布式|分布式词汇库}, delta: {terms: [{term: durable, domain: 分布式}]}}, asst: '已记入(虚拟)'}
