# Traefik dynamic configuration (routers/services).
#
# Route table:
#   - HTTP:  `/api/*` -> host-run FastAPI on :8300 (prefix stripped —
#            the API mounts its routers without an ``/api`` prefix; clients add it).
#   - HTTP:  `/admin` + `/audio` `/images` `/avatars` -> same API, paths as-is
#            (the web console SPA and its media mounts served by FastAPI itself).
#   - gRPC:  retrieval path -> retrieval:50051 (h2c, plaintext HTTP/2), own entryPoint
http:
  routers:
    delveta-api:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api`)"
      middlewares: ["strip-api"]
      service: delveta-api
    delveta-console:
      entryPoints: ["web"]
      rule: "Path(`/admin`) || PathPrefix(`/admin/`) || PathPrefix(`/audio/`) || PathPrefix(`/images/`) || PathPrefix(`/avatars/`)"
      service: delveta-api
    delveta-retrieval:
      entryPoints: ["grpc"]
      rule: "PathPrefix(`/retrieval.v1.RetrievalService/`)"
      service: delveta-retrieval

  middlewares:
    strip-api:
      stripPrefix:
        prefixes: ["/api"]

  services:
    delveta-api:
      loadBalancer:
        servers:
          # Explicit IPv4: host.docker.internal also yields a ULA IPv6 that the host-run
          # API (bound 0.0.0.0) never answers — Go's dialer would hang on it.
          - url: "http://192.168.65.254:8300"  # = host.docker.internal (Docker Desktop host gateway)
    delveta-retrieval:
      loadBalancer:
        servers:
          - url: "h2c://retrieval:50051"
